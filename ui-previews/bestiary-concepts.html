<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ScrollMonsters Bestiary UI Concepts</title>
  <style>
    @font-face { font-family: NinjaPixel; src: url("../assets/Ninja Adventure - Asset Pack/Ui/Font/NormalFont.ttf"); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1d1715; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, calc(100vh * .6)); height: min(100vh, calc(100vw / .6)); image-rendering: pixelated; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="preview" width="540" height="900" aria-label="Interactive Bestiary UI concept preview"></canvas>
  <script src="bestiary-concepts.js"></script>
</body>
</html>
