<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bestiary 2 - Hunter's Journal</title>
<style>
  /* Direction 2: a field journal. Every section is always on the page; what you have not researched is
     covered by marker bars. Raising a research rank wipes the bars away. The sketch goes from silhouette
     to pencil to full colour as you learn the creature. */
  :root{
    --wood:#24170f; --wood2:#33221a; --paper:#f0e2c2; --paper2:#e6d3a8; --rule:#cdb98d; --ink:#3a2a1b; --ink2:#6b5239;
    --red:#b3382c; --blue:#3f6f9a; --gold:#d6a62b; --marker:#2b1e12; --tc:#8a6d3b;
    --sil-filter:brightness(0) sepia(1) opacity(.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{color:var(--ink);font:17px/28px 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    background:
      repeating-linear-gradient(90deg,#00000014 0 2px,transparent 2px 9px),
      repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 5px),
      radial-gradient(1000px 600px at 50% 0,#4a3022,transparent 70%),var(--wood)}
  button{font:inherit;color:inherit;cursor:pointer}
  .px{font-family:NovelMix,ui-monospace,monospace;-webkit-font-smoothing:none;font-smooth:never;line-height:1.2;letter-spacing:.5px}

  .desk{max-width:1340px;margin:0 auto;padding:16px 16px 84px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}

  /* ---- Contents page ---- */
  .paper{background:
      radial-gradient(#8a6d3b12 1px,transparent 1.5px) 0 0/7px 7px,
      linear-gradient(var(--paper),var(--paper2));
    box-shadow:0 1px 0 #fff6 inset,0 14px 30px #0008,0 0 0 1px #00000040;border-radius:3px}
  .contents{padding:14px 14px 18px;position:sticky;top:16px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
  .contents h2{margin:0 0 4px;font-size:27px;font-weight:400;color:var(--ink)}
  .kinds{display:flex;gap:4px;margin:6px 0 8px;flex-wrap:wrap}
  .kt{background:#d9c392;border:2px solid #b49a62;border-bottom:0;padding:0 8px;font-size:18px;color:var(--ink2);line-height:26px;border-radius:4px 4px 0 0}
  .kt.on{background:var(--paper);color:var(--ink);border-color:var(--ink2);box-shadow:0 2px 0 var(--paper)}
  .kt small{font:inherit;color:var(--red)}
  .prog{height:10px;background:#00000014;border:2px solid #00000040;margin:0 0 8px}
  .prog i{display:block;height:100%;background:var(--red)}
  .ixlist{overflow:auto;margin:0 -6px;padding:0 6px;flex:1;scrollbar-width:thin;scrollbar-color:#b49a62 transparent}
  .ix{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-bottom:1px dashed #00000030;padding:3px 4px;text-align:left;line-height:22px}
  .ix:hover{background:#ffffff40}
  .ix.on{background:#fff5;box-shadow:inset 4px 0 0 var(--red)}
  .ix .no{font-size:18px;color:var(--ink2);width:34px;flex:none}
  .ix .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ix .nm.unk{color:#00000050;letter-spacing:2px}
  .ix .mk{width:14px;height:14px;flex:none;border:2px solid var(--ink2);border-radius:50%}
  .ix .mk.on{background:var(--c);border-color:var(--ink)}
  .ix small{color:var(--red);font:18px NovelMix;transform:rotate(-6deg)}
  .ix .th{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;background:#00000010}
  .ix .th>*{mix-blend-mode:multiply}
  .pp{display:inline-flex;gap:3px}
  .pp i{width:9px;height:9px;border:2px solid var(--ink2);transform:rotate(45deg)}
  .pp i.on{background:var(--red);border-color:var(--red)}

  /* ---- Book ---- */
  .book{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);position:relative;border-radius:6px;
    background:linear-gradient(90deg,var(--paper) 0,var(--paper2) 49.2%,#b9a06a 49.8%,var(--paper2) 50.4%,var(--paper) 100%);
    background-size:100% 100%;box-shadow:0 0 0 6px #5a3a22,0 0 0 8px #2a190e,0 22px 40px #000a}
  .book::before{content:'';position:absolute;inset:0;background:radial-gradient(#8a6d3b10 1px,transparent 1.5px) 0 0/7px 7px;pointer-events:none;border-radius:6px}
  .page{position:relative;padding:22px 22px 26px}
  .left{background:linear-gradient(90deg,transparent 85%,#0000001c 100%)}
  .right{background:linear-gradient(90deg,#0000001c 0,transparent 8%),repeating-linear-gradient(transparent 0 27px,#cdb98d66 27px 28px);background-position:0 18px}
  .turn{animation:turn .38s ease-out}
  @keyframes turn{from{opacity:.25;transform:perspective(1200px) rotateY(-10deg) translateX(-8px)}to{opacity:1;transform:none}}
  .backbar,.left .mtitle{display:none}

  /* Sketch page */
  .photo{position:relative;background:#faf3df;padding:12px 12px 14px;box-shadow:0 6px 14px #0004,0 0 0 1px #0002;transform:rotate(-1.6deg);margin:6px 8px 14px}
  .photo::before,.photo::after{content:'';position:absolute;top:-10px;width:70px;height:22px;background:#ecd98a99;border-left:2px dotted #0002;border-right:2px dotted #0002;transform:rotate(-8deg)}
  .photo::before{left:-18px}.photo::after{right:-18px;transform:rotate(7deg)}
  .frame{position:relative;aspect-ratio:1;background:
      radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--tc) 22%,transparent),transparent 62%),#f5ecd2;
      display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px #0002}
  .frame .bsprite{mix-blend-mode:multiply}
  .frame[data-r="1"] .bsprite{filter:brightness(0) sepia(1) contrast(.9) opacity(.55)}
  .frame[data-r="2"] .bsprite{filter:grayscale(1) contrast(1.25) brightness(1.08) sepia(.3)}
  .frame[data-r="3"] .bsprite{filter:saturate(.85) sepia(.14)}
  .frame[data-r="4"]{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 22px #d6a62b66}
  .frame .q{font:108px/1 NovelMix;color:#00000026}
  .cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:18px;color:var(--ink)}
  .cap span:last-child{color:var(--ink2)}
  .stamp{position:absolute;right:-14px;bottom:44px;transform:rotate(-11deg);border:4px solid var(--red);color:var(--red);padding:2px 10px;font-size:27px;mix-blend-mode:multiply;opacity:.88;background:#b3382c10}
  .stamp.thunk{animation:thunk .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes thunk{0%{transform:rotate(-11deg) scale(2.2);opacity:0}60%{opacity:.95}100%{transform:rotate(-11deg) scale(1);opacity:.88}}
  .seal{position:absolute;left:-16px;bottom:34px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d77a,#b98a1f 70%);box-shadow:0 3px 6px #0006,inset 0 0 0 4px #d6a62b,inset 0 0 0 7px #8f6a14;display:flex;align-items:center;justify-content:center;color:#6b4c0c;font:18px NovelMix}
  .tasks h3,.sec h3{margin:0;font:18px/28px NovelMix;letter-spacing:1px;color:var(--ink);border-bottom:2px solid var(--ink);display:inline-block;padding-right:10px}
  .tasks ul{list-style:none;margin:6px 0 0;padding:0}
  .tasks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;line-height:22px;padding:3px 0}
  .tasks .bx{width:18px;height:18px;border:2px solid var(--ink);margin-top:2px;position:relative;background:#fff5}
  .tasks li.done .bx::after{content:'';position:absolute;left:3px;top:-3px;width:6px;height:12px;border:solid var(--red);border-width:0 3px 3px 0;transform:rotate(40deg)}
  .tasks li.done span{text-decoration:line-through;text-decoration-color:var(--red);color:var(--ink2)}
  .tasks li.cur span{font-weight:700}
  .pencil{height:10px;background:#00000014;margin-top:4px;border-radius:5px;position:relative;overflow:hidden}
  .pencil i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--blue) 0 3px,#6d9bc4 3px 6px)}
  .tasks small{display:block;color:var(--ink2);font-size:14px;line-height:18px}

  /* Notes page */
  .title{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;margin-bottom:6px}
  .title h1{margin:0;font:400 36px/40px NovelMix;color:var(--ink)}
  .mark{display:inline-block;padding:0 8px;background:linear-gradient(transparent 0 20%,color-mix(in srgb,var(--tc) 65%,#fff0) 20% 90%,transparent 90%);font:18px/28px NovelMix;color:var(--ink)}
  .sec{margin:0 0 14px;position:relative}
  .sec>.body{margin-top:2px}
  .note{font-style:italic;color:#2f2216}
  .note::before{content:'\201C';font-size:30px;color:var(--red);margin-right:4px;line-height:0;vertical-align:-8px}
  .margin{color:var(--red);font-style:italic;transform:rotate(-1deg);display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding-top:6px}
  .idx{background:#fffaf0;padding:8px 10px 8px;box-shadow:0 3px 6px #0003;position:relative;line-height:20px;transform:rotate(var(--rot,0deg));border-top:5px solid var(--tc)}
  .idx::before{content:'';position:absolute;top:-9px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 2px 0 #0004;transform:translateX(-50%)}
  .idx b{display:block;font:400 18px/22px NovelMix;margin-top:2px}
  .idx span{color:var(--ink2);font-size:15px}
  .idx.blank{background:#ffffff55;border-top-color:#00000030;box-shadow:none;border:2px dashed #00000035;min-height:62px}
  .idx.blank::before{display:none}
  .kin{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-top:4px}
  .pol{background:#faf3df;padding:5px 5px 2px;box-shadow:0 3px 6px #0003;text-align:center;font-size:14px;line-height:18px;transform:rotate(var(--rot,0deg));min-width:62px}
  .pol .q{width:56px;height:56px;background:#00000012;display:flex;align-items:center;justify-content:center;font:27px NovelMix;color:#00000040}
  .pol .bface,.pol .bsprite{margin:0 auto}
  .op{font:27px NovelMix;color:var(--ink2)}
  .recipe{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .facts{display:flex;gap:10px 28px;align-items:center;flex-wrap:wrap}
  .facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 14px}
  .facts dt{color:var(--ink2)} .facts dd{margin:0;font:18px/28px NovelMix}
  .radar{color:var(--ink2);width:130px;padding:4px 14px}
  .radar svg{width:100%;height:auto}
  .hist{display:flex;gap:22px;flex-wrap:wrap}
  .hist div{line-height:20px}.hist b{display:block;font:400 27px/30px NovelMix}.hist span{color:var(--ink2);font-size:14px}

  /* Redaction */
  .redact{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 0}
  .redact i{display:block;height:18px;background:var(--marker);border-radius:2px;transform:rotate(var(--r,0deg));box-shadow:0 1px 0 #0003}
  .redact em{position:absolute;right:0;top:50%;transform:translateY(-50%) rotate(-3deg);font:18px NovelMix;font-style:normal;color:var(--paper);background:var(--red);padding:0 8px;box-shadow:0 2px 0 #0003}
  .fresh{animation:inkin .9s ease-out both}
  .fresh::after{content:'';position:absolute;inset:-2px;background:var(--marker);transform-origin:right;animation:wipe .75s .2s cubic-bezier(.6,0,.3,1) forwards}
  @keyframes inkin{from{filter:blur(4px);opacity:.2}to{filter:none;opacity:1}}
  @keyframes wipe{to{transform:scaleX(0)}}
  .sec.relative{position:relative}

  /* Phone */
  @media(max-width:1020px){
    .desk{grid-template-columns:1fr}
    .contents{position:static;max-height:none}
    .ixlist{overflow:visible}
    .book{display:none}
    .desk.open .contents{display:none}
    .desk.open .book{display:grid;grid-template-columns:1fr}
    .backbar{display:flex;justify-content:space-between;margin-bottom:10px}
    .left .mtitle{display:flex;margin-bottom:18px}
    .right .title{display:none}
    .backbar button{background:#d9c392;border:2px solid var(--ink2);padding:0 12px;font:18px/28px NovelMix;color:var(--ink)}
    .left{background:none}
    .right{background:repeating-linear-gradient(transparent 0 27px,#cdb98d66 27px 28px);background-position:0 18px}
    .book{background:var(--paper)}
    .photo{max-width:340px;margin-left:auto;margin-right:auto}
  }
  @media(prefers-reduced-motion:reduce){.turn,.stamp.thunk,.fresh,.fresh::after{animation:none}.fresh::after{display:none}}
</style>
</head>
<body>
<div class="desk" id="desk">
  <aside class="paper contents">
    <h2 class="px">JOURNAL</h2>
    <div class="px" style="font-size:18px;color:var(--ink2)">Researched <span id="rk" style="color:var(--red)"></span></div>
    <div class="prog"><i id="rbar"></i></div>
    <nav class="kinds" id="kinds"></nav>
    <div id="kcount" style="font-size:14px;line-height:18px;color:var(--ink2);margin:-2px 0 8px"></div>
    <div class="ixlist" id="ix"></div>
  </aside>
  <main class="book" id="book"></main>
</div>
<script src="bestiary-assets.js"></script>
<script src="bestiary-data.js"></script>
<script>
(() => {
  const B = Bestiary, h = B.h, T = B.TYPES;
  let kind = 'creature', sel = 'cat', just = null;
  const prev = {}; B.ENTRIES.forEach((e) => { prev[e.id] = B.rank(e.id); });
  const $ = (id) => document.getElementById(id);
  const desk = $('desk');
  const SHORT = { creature: 'CREATURES', evolution: 'EVOS', foe: 'FOES' };
  const RANKS = (id) => B.KINDS[B.BY_ID[id].kind].ranks;

  const pips = (n) => h('span', { class: 'pp', title: 'Research rank ' + n + ' of 4' }, [1, 2, 3, 4].map((i) => h('i', { class: i <= n ? 'on' : '' })));

  /* ---------- Contents ---------- */
  function renderContents() {
    const t = B.totals(); $('rk').textContent = t.known + ' / ' + t.total; $('rbar').style.width = (t.known / t.total * 100) + '%';
    const kinds = $('kinds'); kinds.replaceChildren();
    for (const k of Object.keys(B.KINDS)) {
      const p = B.progress(B.byKind(k)[0].id);
      kinds.append(h('button', { class: 'kt px' + (k === kind ? ' on' : ''), title: B.KINDS[k].label + ': ' + p.known + ' of ' + p.total + ' known', onclick: () => { kind = k; sel = B.byKind(k)[0].id; just = null; render(); } }, SHORT[k]));
    }
    const pk = B.progress(B.byKind(kind)[0].id);
    $('kcount').textContent = B.KINDS[kind].label + ': ' + pk.known + ' of ' + pk.total + ' known, ' + pk.owned + ' studied';
    const ix = $('ix'); ix.replaceChildren();
    for (const e of B.byKind(kind)) {
      const r = B.rank(e.id);
      const th = h('div', { class: 'th' }, r === 0 ? h('span', { class: 'px', style: { color: '#00000040', fontSize: '27px' } }, '?') : B.portrait(e.id, { size: 38, sil: r < 2 }));
      let name = B.shownName(e.id);
      if (e.kind === 'evolution' && r < 2) name = e.parents.map((p) => (B.rank(p) >= 1 ? B.BY_ID[p].name : '???')).join(' + ');
      ix.append(h('button', { class: 'ix' + (e.id === sel ? ' on' : ''), style: { '--c': T[e.type].color }, onclick: () => open(e.id) },
        th, h('span', { class: 'no px' }, e.no), h('span', { class: 'nm' + (r === 0 ? ' unk' : '') }, r === 0 && e.kind !== 'evolution' ? '- - - - -' : name),
        B.isNew(e.id) ? h('small', null, 'new!') : null, pips(r)));
    }
  }

  /* ---------- Sections ---------- */
  const fresh = (min) => just && just.id === sel && just.from < min && just.to >= min;
  const rot = (i) => ((B.hash(sel + i) % 5) - 2) * 0.9 + 'deg';
  function redact(min, bars) {
    const hh = B.hash(sel + min + bars.join());
    return h('div', { class: 'redact', title: 'Reach rank ' + min + ' to read this' },
      bars.map((w, i) => h('i', { style: { width: Math.min(100, w + (hh >> i) % 12) + '%', '--r': ((hh >> (i + 2)) % 5 - 2) * 0.3 + 'deg' } })),
      h('em', null, 'RANK ' + min + ' ' + RANKS(sel)[min].toUpperCase()));
  }
  function sec(title, min, build, bars = [88, 64]) {
    const r = B.rank(sel), el = h('section', { class: 'sec' }, h('h3', null, title));
    if (r >= min) { const body = h('div', { class: 'body' }, build()); if (fresh(min)) body.classList.add('fresh'); body.style.position = 'relative'; el.append(body); }
    else el.append(typeof bars === 'function' ? bars() : redact(min, bars));
    return el;
  }
  const pol = (id, shown, i) => h('div', { class: 'pol', style: { '--rot': rot(i) } }, shown ? B.portrait(id, { size: 48 }) : h('div', { class: 'q' }, '?'), h('div', null, shown ? B.BY_ID[id].name : '???'));

  /* ---------- Left page ---------- */
  function leftPage(e, r) {
    const tc = r >= 2 ? T[e.type].color : '#8a6d3b';
    const page = h('div', { class: 'page left turn' });
    page.append(h('div', { class: 'backbar' }, h('button', { onclick: () => desk.classList.remove('open') }, '< INDEX')));
    page.append(h('div', { class: 'mtitle title' }, h('h1', null, B.shownName(e.id)), r >= 2 ? h('span', { class: 'mark', style: { '--tc': tc } }, T[e.type].name.toUpperCase() + ' / ' + e.role.toUpperCase()) : null));
    const s = B.assets.sprites[e.id], scale = Math.max(2, Math.floor(190 / Math.max(s.fw, s.fh)));
    const frame = h('div', { class: 'frame', 'data-r': r, style: { '--tc': tc } }, r === 0 ? h('div', { class: 'q' }, '?') : B.sprite(e.id, { scale, sil: false }));
    const photo = h('div', { class: 'photo' }, frame, h('div', { class: 'cap px' }, h('span', null, 'No.' + e.no), h('span', null, B.shownName(e.id).toUpperCase())));
    if (r >= 1) photo.append(h('div', { class: 'stamp px' + (just && just.id === sel && just.to === r ? ' thunk' : '') }, RANKS(e.id)[r].toUpperCase()));
    if (r >= 4) photo.append(h('div', { class: 'seal' }, '*'));
    page.append(photo);
    const tasks = B.TASKS[e.kind], nt = B.nextTask(e.id);
    page.append(h('div', { class: 'tasks' }, h('h3', null, 'RESEARCH'), pips(r), h('ul', null, tasks.map((t, i) => {
      const done = r >= i + 1, cur = r === i;
      return h('li', { class: (done ? 'done' : '') + (cur ? ' cur' : '') }, h('div', { class: 'bx' }),
        h('div', null, h('span', null, t), cur && nt && nt.total > 1 ? [h('div', { class: 'pencil' }, h('i', { style: { width: Math.min(100, nt.done / nt.total * 100) + '%' } })), h('small', null, nt.done.toLocaleString('en-US') + ' of ' + nt.total.toLocaleString('en-US'))] : null));
    }))));
    return page;
  }

  /* ---------- Right page ---------- */
  function rightPage(e, r) {
    const page = h('div', { class: 'page right turn', style: { '--tc': r >= 2 ? T[e.type].color : '#8a6d3b' } });
    page.append(h('div', { class: 'title' }, h('h1', null, B.shownName(e.id)),
      r >= 2 ? h('span', { class: 'mark' }, T[e.type].name.toUpperCase() + ' / ' + e.role.toUpperCase()) : h('span', { class: 'mark px', style: { opacity: .5 } }, '??? / ???')));
    if (r === 0) page.append(h('div', { class: 'note margin', style: { marginBottom: '10px' } }, e.kind === 'evolution' ? 'Blank. Merge two creatures on an expedition to fill this page.' : 'Blank. Nothing known yet. Look for a den.'));
    if (r === 1) page.append(h('div', { class: 'note margin', style: { marginBottom: '10px' } }, e.kind === 'foe' ? 'Spotted, not studied. Defeat one.' : e.kind === 'evolution' ? 'Rumour only. Merge the parents to be sure.' : 'Spotted at a den. Capture one to study it.'));

    if (e.kind === 'foe') {
      page.append(sec('BEHAVIOUR', 2, () => h('div', null, e.behavior)));
      page.append(sec('TELL', 2, () => h('div', null, e.tell), [70]));
      page.append(sec('NOTE I', 2, () => h('div', { class: 'note' }, e.flavor), [80]));
      page.append(sec('HOW TO BEAT IT', 3, () => h('div', { class: 'margin', style: { transform: 'rotate(-.6deg)' } }, e.counter)));
      page.append(sec('VARIANTS', 2, () => h('div', { class: 'kin' }, e.variants.map((v, i) => { const sh = r >= 2 + (i > 0 ? 1 : 0), sp = B.assets.sprites[v]; return h('div', { class: 'pol', style: { '--rot': rot(i) } }, B.sprite(v, { scale: Math.max(2, Math.floor(56 / Math.max(sp.fw, sp.fh))), sil: !sh }), h('div', null, sh ? (i === 0 ? 'Common' : 'Rare') : '???')); })), [50]));
      page.append(sec('NOTE II', 4, () => h('div', { class: 'note' }, e.lore), [76, 40]));
      page.append(sec('STATS', 2, () => h('div', { class: 'facts' }, h('dl', null, e.facts.flatMap(([a, b]) => [h('dt', null, a), h('dd', null, b)])), h('div', { class: 'radar', html: B.radar(e.id, { size: 130 }) })), [60]));
    } else {
      page.append(sec('ABILITY', 2, () => h('div', null, e.ability, e.dash ? h('div', { style: { color: 'var(--ink2)' } }, 'Dash: ' + e.dash + '.') : null)));
      page.append(sec('NOTE I', 2, () => h('div', { class: 'note' }, e.flavor), [80, 50]));
      page.append(sec('STATS', 2, () => h('div', { class: 'facts' }, h('dl', null, e.facts.flatMap(([a, b]) => [h('dt', null, a), h('dd', null, b)])), h('div', { class: 'radar', html: B.radar(e.id, { size: 130 }) })), [60]));
      page.append(sec('UPGRADES SEEN', 3, () => h('div', { class: 'cards' }, e.upgrades.map((u, i) => h('div', { class: 'idx', style: { '--rot': rot(i) } }, h('b', null, u.name), h('span', null, u.detail)))),
        () => h('div', { class: 'redact', style: { padding: 0 } }, h('div', { class: 'cards', title: 'Reach rank 3 to read these' }, e.upgrades.map((u, i) => h('div', { class: 'idx blank', style: { '--rot': rot(i) } }, h('div', { class: 'px', style: { color: '#00000045' } }, '?')))), h('em', null, 'RANK 3 ' + RANKS(e.id)[3].toUpperCase()))));
      if (e.kind === 'creature') {
        page.append(sec('KIN', 2, () => {
          const box = h('div');
          const evos = B.childrenOf(e.id);
          if (evos.length) for (const ev of evos) { const partner = ev.parents.find((x) => x !== e.id); box.append(h('div', { class: 'recipe' }, pol(e.id, true, 1), h('span', { class: 'op' }, '+'), pol(partner, B.rank(partner) >= 1, 2), h('span', { class: 'op' }, '='), pol(ev.id, B.rank(ev.id) >= 2, 3))); }
          else box.append(h('div', { class: 'note' }, 'No evolution found yet.'));
          const syn = B.synergiesOf(e.id);
          for (const sy of syn) { const partner = sy.a === e.id ? sy.b : sy.a; box.append(h('div', { class: 'recipe' }, pol(partner, B.rank(partner) >= 1, 4), r >= 3 ? h('div', null, h('b', null, sy.name), h('br'), sy.detail) : h('div', { class: 'redact', style: { flex: 1 } }, h('i', { style: { width: '70%' } }), h('em', null, 'RANK 3')))); }
          return box;
        }, [66, 44]));
      } else {
        page.append(sec('RECIPE', 2, () => h('div', null, h('div', { class: 'recipe' }, pol(e.parents[0], B.rank(e.parents[0]) >= 1, 1), h('span', { class: 'op' }, '+'), pol(e.parents[1], B.rank(e.parents[1]) >= 1, 2), h('span', { class: 'op' }, '='), pol(e.id, true, 3)), h('div', null, '+' + e.hp + ' party HP. ' + e.bonus + '.')), [66]));
      }
      page.append(sec('NOTE II', 4, () => h('div', { class: 'note' }, e.lore), [76, 40]));
    }
    page.append(sec('YOUR LOG', 2, () => h('div', { class: 'hist' }, B.history(e.id).map(([a, b]) => h('div', null, h('b', null, b), h('span', null, a)))), [50]));
    return page;
  }

  function renderBook() {
    const e = B.BY_ID[sel], r = B.rank(sel), book = $('book');
    book.replaceChildren(leftPage(e, r), rightPage(e, r));
  }
  function open(id) { sel = id; just = null; B.markViewed(id); render(); desk.classList.add('open'); window.scrollTo({ top: 0 }); }
  function render() { renderContents(); renderBook(); }

  /* Demo: raise or lower the selected entry's research rank */
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const from = B.rank(sel), to = b.dataset.act === 'up' ? from + 1 : from - 1;
    if (to < 0 || to > 4) return;
    B.setRank(sel, to);
  });
  B.onChange((why) => {
    if (why.id) { const from = prev[why.id]; just = from < why.rank ? { id: why.id, from, to: why.rank } : null; }
    else just = null;
    B.ENTRIES.forEach((e) => { prev[e.id] = B.rank(e.id); });
    render();
  });
  B.demoBar({ extra: '<button data-act="up">+ Research</button><button data-act="down">- Research</button>' });
  B.markViewed(sel);
  render();
})();
</script>
</body>
</html>
