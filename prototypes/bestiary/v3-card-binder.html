<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bestiary 3 - Card Binder</title>
<style>
  /* Direction 3: a collector's binder. Every entry is a trading card in a plastic sleeve.
     Unmet cards show a card back, seen cards are ghost cards, mastered cards get foil.
     Hover tilts a card. Tap one to inspect it, and flip it for your collection record. */
  :root{
    --felt:#0a2130; --felt2:#0d2b3d; --gold:#ffd36b; --gold2:#b88a1c; --ink:#0a1620; --txt:#eaf4fa; --mut:#8fb0c4;
    --sil-filter:brightness(0) invert(.12) sepia(.4) hue-rotate(170deg) saturate(2);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{color:var(--txt);font:14px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1100px 600px at 50% -10%,#1b5470 0,transparent 62%),
      repeating-conic-gradient(#0a2130 0 25%,#0c2636 0 50%) 0 0/32px 32px;background-color:var(--felt)}
  button{font:inherit;color:inherit;cursor:pointer}
  .px{font-family:NovelMix,ui-monospace,monospace;-webkit-font-smoothing:none;font-smooth:never;line-height:1.15}

  .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 90px}
  .head{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:14px}
  .head h1{margin:0;font-size:36px;font-weight:400;color:var(--gold);text-shadow:0 3px 0 #000a,0 0 18px #ffd36b44}
  .meters{display:flex;gap:10px;flex-wrap:wrap;flex:1;justify-content:flex-end}
  .ring{display:flex;align-items:center;gap:10px;background:#00000040;border:1px solid #ffffff1c;padding:6px 14px 6px 8px;border-radius:999px;cursor:pointer}
  .ring:hover{background:#ffffff14}
  .ring svg{width:38px;height:38px;transform:rotate(-90deg);flex:none}
  .ring b{display:block;font:400 18px/1 NovelMix}
  .ring small{display:block;color:var(--mut);font-size:12px}

  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .sets{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;flex:1;min-width:0;scrollbar-width:thin}
  .set{flex:none;display:flex;gap:6px;align-items:center;background:#00000040;border:1px solid #ffffff22;border-radius:8px;padding:3px 9px 3px 6px;font-size:12px;color:var(--mut)}
  .set i{width:12px;height:12px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 8px var(--c)}
  .set b{font:400 18px/1 NovelMix;color:var(--txt)}
  .set.done{border-color:var(--gold);color:var(--gold)}
  .set.on{background:#ffffff1f;border-color:#fff}
  .seg{display:flex;border:1px solid #ffffff2a;border-radius:8px;overflow:hidden;flex:none}
  .seg button{background:#00000040;border:0;padding:6px 12px;color:var(--mut);font-size:13px}
  .seg button.on{background:var(--gold);color:#241800;font-weight:700}

  .section{margin:0 0 30px}
  .section h2{display:flex;align-items:baseline;gap:12px;margin:0 0 10px;font:400 18px/1 NovelMix;color:var(--txt);letter-spacing:1px;scroll-margin-top:12px}
  .section h2 span{color:var(--gold)}
  .section h2::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,#ffffff30,transparent)}
  .grid{display:grid;gap:12px}
  .slot{position:relative;display:flex;justify-content:center;padding:6px;border-radius:10px;
    background:linear-gradient(135deg,#ffffff12,#ffffff04 40%,#ffffff0d);border:1px solid #ffffff22;box-shadow:inset 0 0 18px #00000055;
    perspective:800px;opacity:0;animation:slotin .35s ease-out forwards;animation-delay:calc(var(--i)*18ms)}
  @keyframes slotin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
  .slot.dim{opacity:.18!important;filter:saturate(.4)}

  /* ---- The card (220 x 308, scaled with zoom) ---- */
  .card{--tc:#888;width:220px;height:308px;zoom:var(--k,1);position:relative;transform-style:preserve-3d;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));transition:transform .25s ease-out,box-shadow .25s;
    border-radius:14px;cursor:pointer;color:#fff}
  .card.tilting{transition:transform .06s linear}
  .face{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .front{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 85%,#fff) 0,var(--tc) 40%,color-mix(in srgb,var(--tc) 55%,#000) 100%);
    box-shadow:0 8px 18px #0008,inset 0 0 0 2px #fff7,inset 0 0 0 5px #0006;padding:9px}
  .inner{height:100%;border-radius:8px;background:#0b141c;display:flex;flex-direction:column;box-shadow:inset 0 0 0 2px #0009}
  .top{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 3px;background:linear-gradient(#ffffff1c,#ffffff08);border-radius:8px 8px 0 0}
  .top .nm{font:18px/1.1 NovelMix;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .ty{display:flex;align-items:center;gap:4px;font:9px/1 NovelMix;color:var(--tc);flex:none}
  .top .ty i{width:10px;height:10px;background:var(--tc);transform:rotate(45deg)}
  .art{position:relative;margin:0 6px;height:128px;border:2px solid #000a;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(circle at 50% 80%,color-mix(in srgb,var(--tc) 70%,transparent),transparent 65%),repeating-linear-gradient(135deg,#ffffff0a 0 6px,transparent 6px 12px),linear-gradient(#18283a,#0d1a26)}
  .art .gr{position:absolute;bottom:14px;width:90px;height:12px;border-radius:50%;background:#000;opacity:.4}
  .art .bsprite{position:relative}
  .art .qq{font:54px/1 NovelMix;color:#ffffff22}
  .strip{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 0;font:18px/1 NovelMix;color:var(--mut);height:24px}
  .gems{display:flex;gap:4px}
  .gems i{width:9px;height:9px;transform:rotate(45deg);background:#00000080;border:1px solid #fff4}
  .gems i.on{background:var(--gold);border-color:#fff}
  .txt{margin:4px 6px 0;padding:3px 6px;height:58px;overflow:hidden;background:#0006;border-radius:4px;font-size:12px;line-height:1.3;color:#d6e6f0}
  .bars{display:flex;gap:6px;justify-content:space-between;padding:4px 10px 8px;margin-top:auto}
  .bars div{flex:1;text-align:center;font:9px/1 NovelMix;color:var(--mut)}
  .txt .rl{display:block;font:18px/1.1 NovelMix;color:var(--tc);filter:brightness(1.2)}
  .bars div span{display:block;height:20px;background:#00000066;margin-top:2px;position:relative}
  .bars div span i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--tc),color-mix(in srgb,var(--tc) 55%,#000))}
  .bars div.off span i{opacity:.25;background:#fff;height:2px!important}
  /* ghost card (seen) */
  .card.ghost .front{background:linear-gradient(160deg,#5c6c78,#34424d);box-shadow:0 6px 12px #0007,inset 0 0 0 2px #ffffff30,inset 0 0 0 5px #0006}
  .card.ghost .top .ty{color:#789}
  .card.ghost .art{background:linear-gradient(#1a2631,#101a23)}
  /* card back (unknown) */
  .back{transform:rotateY(180deg);background:
      radial-gradient(circle at 50% 50%,#17475e 0 24%,transparent 25%),
      repeating-conic-gradient(from 45deg,#0f3447 0 25%,#0b2838 0 50%) 0 0/22px 22px;
      box-shadow:0 8px 18px #0008,inset 0 0 0 3px #3d86a6,inset 0 0 0 8px #0a2130,inset 0 0 0 10px #3d86a688;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px}
  .card:not(.unknown)>.back{display:none}
  .card.unknown .front{display:none}
  .card.unknown .back{transform:none}
  .back .em{width:94px;height:94px;border-radius:50%;background:#0b2230;border:3px solid #3d86a6;display:flex;align-items:center;justify-content:center;font:54px/1 NovelMix;color:#6fb7d6;box-shadow:0 0 22px #3d86a655}
  .back .no{font:18px NovelMix;color:#6fb7d6;background:#0a2130;padding:2px 10px;border-radius:4px}
  /* record side of an inspected card */
  .rec{transform:rotateY(180deg);background:linear-gradient(160deg,#16384b,#0c2230);box-shadow:0 8px 18px #0008,inset 0 0 0 3px var(--gold2),inset 0 0 0 8px #0a2130;padding:18px 16px;display:flex;flex-direction:column;gap:3px}
  .rec h4{margin:0;font:18px/1.1 NovelMix;color:var(--gold)}
  .rec .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);border-bottom:1px dashed #ffffff22;padding:2px 0}
  .rec .row b{color:var(--txt);font:18px/1 NovelMix}
  .rec .stp{font-size:11px;line-height:1.25;display:grid;grid-template-columns:14px 1fr;gap:6px;align-items:start;color:var(--mut)}
  .rec .stp i{width:12px;height:12px;border:2px solid var(--mut);margin-top:2px}
  .rec .stp.d{color:var(--txt)} .rec .stp.d i{background:var(--gold);border-color:var(--gold)}
  .rec .pb{height:8px;background:#0006;border:1px solid #fff3;margin-top:3px}
  .rec .pb i{display:block;height:100%;background:var(--gold);border:0;width:auto;margin:0}
  /* foil */
  .foil .front::after,.foil .inner::after{content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;mix-blend-mode:color-dodge;opacity:.32;
    background:linear-gradient(115deg,transparent 20%,#ff00a066 32%,#00e5ff66 44%,#ffee0066 56%,#7a5cff66 68%,transparent 80%);
    background-size:220% 220%;background-position:calc(var(--mx,.3)*100%) calc(var(--my,.3)*100%)}
  .foil .front{box-shadow:0 8px 18px #0008,inset 0 0 0 2px #fff,inset 0 0 0 5px #0006,0 0 14px #ffd36b66}
  .glare{position:absolute;inset:0;border-radius:14px;pointer-events:none;opacity:var(--gl,0);transition:opacity .2s;
    background:radial-gradient(circle at calc(var(--mx,.5)*100%) calc(var(--my,.5)*100%),#ffffff55,transparent 45%);mix-blend-mode:overlay}
  .new{position:absolute;right:-6px;top:10px;z-index:3;background:var(--gold);color:#2a1d00;font:18px/1 NovelMix;padding:3px 8px;transform:rotate(8deg);box-shadow:0 3px 0 #0006;animation:np 1s steps(2) infinite}
  @keyframes np{50%{filter:brightness(1.25)}}
  .reveal{animation:reveal 1s cubic-bezier(.3,1.3,.5,1)}
  @keyframes reveal{0%{transform:rotateY(90deg) scale(1.1);filter:brightness(3)}50%{transform:rotateY(-12deg) scale(1.12);filter:brightness(1.6)}100%{transform:none;filter:none}}
  .shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---- Inspect ---- */
  .ov{position:fixed;inset:0;z-index:50;background:#030a10e8;display:none;overflow:auto}
  .ov.on{display:block}
  .ovbox{min-height:100%;display:grid;grid-template-columns:minmax(300px,420px) minmax(280px,520px);gap:28px;justify-content:center;align-items:center;padding:30px 16px 90px}
  .stagecard{display:flex;flex-direction:column;align-items:center;gap:14px;perspective:1000px}
  .stagecard .card{zoom:1.5;cursor:pointer}
  .stagecard .card.flipped{transform:rotateY(calc(180deg + var(--ry,0deg))) rotateX(var(--rx,0deg))}
  .stagecard small{color:var(--mut)}
  .nav{display:flex;gap:8px}
  .nav button,.xbtn{background:#ffffff14;border:1px solid #fff3;border-radius:8px;padding:6px 14px;min-height:36px}
  .nav button:hover,.xbtn:hover{background:#ffffff26}
  .xbtn{position:fixed;right:14px;top:12px;z-index:60;font:18px NovelMix}
  .panel{background:#0b1a24;border:1px solid #ffffff2a;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px #0008}
  .panel h3{margin:0;font:400 27px/1 NovelMix}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:2px 10px;border-radius:999px;border:1px solid var(--c,#fff6);background:color-mix(in srgb,var(--c,#fff) 20%,#0b1a24);font:18px/1.2 NovelMix}
  .panel h4{margin:0 0 4px;font:18px/1 NovelMix;color:var(--gold);letter-spacing:1px}
  .ups{display:grid;gap:6px}
  .up{background:#ffffff0d;border-left:4px solid var(--tc);padding:4px 10px}
  .up b{display:block;font:18px/1.2 NovelMix} .up span{color:var(--mut);font-size:13px}
  .scratch{background:repeating-linear-gradient(115deg,#8d98a1 0 5px,#aeb8bf 5px 10px,#c3ccd2 10px 12px);color:#26303a;padding:6px 10px;border-radius:4px;font:18px/1.2 NovelMix;display:flex;justify-content:space-between;gap:10px;box-shadow:inset 0 0 8px #0005}
  .kin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mini{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut);gap:2px}
  .mini .q{width:48px;height:48px;border:2px dashed #fff3;display:flex;align-items:center;justify-content:center;font:27px NovelMix;color:#fff4}
  .op{font:27px NovelMix;color:var(--mut)}
  .radar{color:var(--mut);width:150px;margin:-6px auto -6px 0}
  .rowflex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0}
  .facts dt{color:var(--mut)} .facts dd{margin:0;font:18px/1.2 NovelMix;color:var(--gold)}
  .quote{font-style:italic;color:#cfe3ef;border-left:3px solid var(--tc);padding-left:10px}
  .hint2{color:var(--mut);font-size:13px}

  @media(max-width:820px){
    .ovbox{grid-template-columns:1fr;gap:18px;padding-top:44px}
    .stagecard .card{zoom:1.3}
    .head h1{font-size:27px}
    .meters{justify-content:flex-start}
  }
  @media(prefers-reduced-motion:reduce){.slot,.reveal,.new,.shake{animation:none;opacity:1}.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1 class="px">BINDER</h1>
    <div class="meters" id="meters"></div>
  </header>
  <div class="tools">
    <div class="sets" id="sets" aria-label="Sets by type"></div>
    <div class="seg" id="seg"></div>
  </div>
  <div id="sections"></div>
</div>
<div class="ov" id="ov" aria-modal="true" role="dialog"></div>
<script src="bestiary-assets.js"></script>
<script src="bestiary-data.js"></script>
<script>
(() => {
  const B = Bestiary, h = B.h, T = B.TYPES;
  let typeFilter = null, view = 'all', inspect = null, flipped = false, justRevealed = null, k = 1;
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

  const gems = (n) => h('span', { class: 'gems' }, [1, 2, 3, 4].map((i) => h('i', { class: i <= n ? 'on' : '' })));

  /* ---------- Card ---------- */
  function card(e, { big = false } = {}) {
    const r = B.rank(e.id), tc = T[e.type].color;
    const c = h('div', { class: 'card' + (r === 0 ? ' unknown' : '') + (r === 1 ? ' ghost' : '') + (r >= 4 ? ' foil' : ''), style: { '--tc': r >= 2 ? tc : '#6d8294' }, 'data-id': e.id });
    const known = r >= 2;
    const s = B.assets.sprites[e.id], scale = Math.max(2, Math.floor(104 / Math.max(s.fw, s.fh)));
    const art = h('div', { class: 'art' }, h('div', { class: 'gr' }), B.sprite(e.id, { scale, sil: !known }));
    const front = h('div', { class: 'face front' }, h('div', { class: 'inner' },
      h('div', { class: 'top' }, h('span', { class: 'nm' }, B.shownName(e.id)), known ? h('span', { class: 'ty' }, h('i'), T[e.type].name.toUpperCase()) : h('span', { class: 'ty' }, '???')),
      art,
      h('div', { class: 'strip' }, h('span', null, 'No.' + e.no), gems(r)),
      h('div', { class: 'txt' }, known ? [h('span', { class: 'rl' }, e.role.toUpperCase()), e.blurb + '.'] : e.kind === 'foe' ? 'Defeat one to study it.' : e.kind === 'evolution' ? 'Merge the parents to find out.' : 'Capture one to study it.'),
      h('div', { class: 'bars' }, e.radar.map((v, i) => h('div', { class: known ? '' : 'off' }, B.KINDS[e.kind].axes[i].slice(0, 3), h('span', null, h('i', { style: { height: (known ? v / 5 * 100 : 0) + '%' } }))))),
      h('div', { class: 'glare' })));
    const back = h('div', { class: 'face back' }, h('div', { class: 'em' }, '?'), h('div', { class: 'no' }, 'No.' + e.no));
    c.append(front, back);
    if (big) { c.append(recordFace(e, r)); }
    if (B.isNew(e.id) && !big) c.append(h('div', { class: 'new' }, 'NEW'));
    if (justRevealed === e.id && !reduce) c.classList.add('reveal');
    return c;
  }
  function recordFace(e, r) {
    const nt = B.nextTask(e.id), names = B.KINDS[e.kind].ranks;
    return h('div', { class: 'face rec' }, h('h4', null, 'RECORD'),
      h('div', { class: 'row' }, h('span', null, 'Entry'), h('b', null, 'No.' + e.no)),
      h('div', { class: 'row' }, h('span', null, 'Rank'), h('b', null, names[r].toUpperCase())),
      ...(r >= 2 ? B.history(e.id).map(([a, b]) => h('div', { class: 'row' }, h('span', null, a), h('b', null, b))) : [h('div', { class: 'row' }, h('span', null, 'History'), h('b', null, '-'))]),
      h('h4', { style: { marginTop: '6px' } }, 'RESEARCH'),
      ...B.TASKS[e.kind].map((t, i) => h('div', { class: 'stp' + (r >= i + 1 ? ' d' : '') }, h('i'), h('div', null, t, r === i && nt && nt.total > 1 ? h('div', { class: 'pb' }, h('i', { style: { width: Math.min(100, nt.done / nt.total * 100) + '%' } })) : null))));
  }

  /* ---------- Binder ---------- */
  const matches = (e) => (!typeFilter || e.type === typeFilter) && (view === 'all' || (view === 'owned' && B.rank(e.id) >= 2) || (view === 'missing' && B.rank(e.id) < 2) || (view === 'foil' && B.rank(e.id) >= 4));
  function ring(label, value, total, color, onclick) {
    const R = 15, C = 2 * Math.PI * R;
    return h('div', { class: 'ring', onclick }, h('span', { html: `<svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="${R}" fill="none" stroke="#ffffff22" stroke-width="5"/><circle cx="19" cy="19" r="${R}" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="${C * value / total} ${C}"/></svg>` }), h('span', null, h('b', null, value + '/' + total), h('small', null, label)));
  }
  function renderTop() {
    const m = $('meters'); m.replaceChildren();
    for (const [kk, col] of [['creature', '#7fe3c4'], ['evolution', '#b58cff'], ['foe', '#ff7a6b']]) {
      const p = B.progress(B.byKind(kk)[0].id);
      m.append(ring(B.KINDS[kk].label, p.known, p.total, col, () => document.getElementById('sec-' + kk).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' })));
    }
    const sets = $('sets'); sets.replaceChildren();
    const ally = B.ENTRIES.filter((e) => e.kind !== 'foe');
    for (const [ty, def] of Object.entries(T)) {
      const members = ally.filter((e) => e.type === ty); if (!members.length) continue;
      const own = members.filter((e) => B.rank(e.id) >= 2).length;
      sets.append(h('button', { class: 'set' + (own === members.length ? ' done' : '') + (typeFilter === ty ? ' on' : ''), style: { '--c': def.color }, title: def.name + ' set: ' + own + ' of ' + members.length + (own === members.length ? ' (complete)' : ''), onclick: () => { typeFilter = typeFilter === ty ? null : ty; render(); } }, h('i'), def.name, h('b', null, own + '/' + members.length)));
    }
    const seg = $('seg'); seg.replaceChildren();
    for (const [v, l] of [['all', 'All'], ['owned', 'Owned'], ['missing', 'Missing'], ['foil', 'Foil']]) seg.append(h('button', { class: v === view ? 'on' : '', onclick: () => { view = v; render(); } }, l));
  }
  function layout() {
    const first = document.querySelector('.grid'); if (!first) return;
    const W = first.clientWidth, gap = 12;
    const cols = Math.max(2, Math.floor((W + gap) / (220 + 12 + gap)));
    const slotW = (W - (cols - 1) * gap) / cols;
    k = Math.min(1, (slotW - 14) / 220);
    document.querySelectorAll('.grid').forEach((g) => { g.style.gridTemplateColumns = `repeat(${cols},1fr)`; g.style.setProperty('--k', k); });
  }
  function renderGrid() {
    const root = $('sections'); root.replaceChildren(); let n = 0;
    for (const kk of Object.keys(B.KINDS)) {
      const p = B.progress(B.byKind(kk)[0].id);
      const grid = h('div', { class: 'grid' });
      for (const e of B.byKind(kk)) {
        const slot = h('div', { class: 'slot' + (matches(e) ? '' : ' dim'), style: { '--i': n++ } }, card(e));
        slot.addEventListener('click', () => openCard(e.id, slot));
        grid.append(slot);
      }
      root.append(h('section', { class: 'section', id: 'sec-' + kk }, h('h2', null, B.KINDS[kk].label.toUpperCase(), h('span', null, p.known + '/' + p.total + ' met')), grid));
    }
    layout();
  }
  function render() { renderTop(); renderGrid(); if (inspect) renderInspect(); justRevealed = null; }

  /* ---------- Tilt (mouse only) ---------- */
  function tilt(root, strength) {
    root.addEventListener('pointermove', (ev) => {
      if (ev.pointerType !== 'mouse') return;
      const c = ev.target.closest('.card'); if (!c || (c.closest('.slot.dim'))) return;
      const b = c.getBoundingClientRect(), x = (ev.clientX - b.left) / b.width, y = (ev.clientY - b.top) / b.height;
      c.classList.add('tilting');
      c.style.setProperty('--ry', ((x - .5) * 2 * strength).toFixed(1) + 'deg'); c.style.setProperty('--rx', ((.5 - y) * 2 * strength).toFixed(1) + 'deg');
      c.style.setProperty('--mx', x.toFixed(2)); c.style.setProperty('--my', y.toFixed(2)); c.style.setProperty('--gl', 1); c.style.setProperty('--s', 1.04);
    });
    root.addEventListener('pointerout', (ev) => {
      const c = ev.target.closest && ev.target.closest('.card'); if (!c || c.contains(ev.relatedTarget)) return;
      c.classList.remove('tilting'); ['--ry', '--rx', '--gl', '--s'].forEach((p) => c.style.removeProperty(p));
    });
  }

  /* ---------- Inspect ---------- */
  function openCard(id, slot) {
    const e = B.BY_ID[id];
    if (B.rank(id) === 0) { const c = slot.querySelector('.card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); return; }
    inspect = id; flipped = false; B.markViewed(id); render(); $('ov').classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function closeInspect() { inspect = null; $('ov').classList.remove('on'); document.body.style.overflow = ''; render(); }
  const order = () => B.ENTRIES.filter((e) => B.rank(e.id) > 0 && matches(e)).map((e) => e.id);
  function step(d) { const o = order(), i = o.indexOf(inspect); if (!o.length) return; inspect = o[(i + d + o.length) % o.length]; flipped = false; B.markViewed(inspect); renderInspect(); renderGrid(); }
  const lock = (e, min) => h('div', { class: 'scratch' }, h('span', null, '▒▒▒▒▒▒▒▒'), h('span', null, B.KINDS[e.kind].ranks[min].toUpperCase()));
  const mini = (id, shown) => h('div', { class: 'mini' }, shown ? B.portrait(id, { size: 48 }) : h('div', { class: 'q' }, '?'), shown ? B.BY_ID[id].name : '???');
  function renderInspect() {
    const e = B.BY_ID[inspect], r = B.rank(inspect), tc = r >= 2 ? T[e.type].color : '#6d8294', ov = $('ov');
    const c = card(e, { big: true }); if (flipped) c.classList.add('flipped');
    c.addEventListener('click', () => { flipped = !flipped; c.classList.toggle('flipped', flipped); });
    c.style.setProperty('--tc', tc);
    const stage = h('div', { class: 'stagecard' }, c, h('small', null, flipped ? 'Tap the card for the front' : 'Tap the card to flip it'),
      h('div', { class: 'nav' }, h('button', { onclick: () => step(-1) }, '< Prev'), h('button', { onclick: () => step(1) }, 'Next >')));
    tilt(stage, 9);
    const p = h('div', { class: 'panel', style: { '--tc': tc } }, h('h3', { class: 'px' }, B.shownName(e.id)));
    if (r >= 2) p.append(h('div', { class: 'chips' }, h('span', { class: 'chip', style: { '--c': tc } }, T[e.type].name.toUpperCase()), h('span', { class: 'chip' }, e.role.toUpperCase()), h('span', { class: 'chip' }, B.KINDS[e.kind].ranks[r].toUpperCase())));
    else p.append(h('div', { class: 'hint2' }, r === 0 ? 'Not found yet.' : e.kind === 'foe' ? 'Spotted. Defeat one to study it.' : e.kind === 'evolution' ? 'A recipe may exist. Merge the parents to find out.' : 'Spotted at a den. Capture one to study it.'));
    const sec = (title, min, build) => h('div', null, h('h4', null, title), r >= min ? build() : lock(e, min));
    if (e.kind === 'foe') {
      p.append(sec('BEHAVIOUR', 2, () => h('div', null, e.behavior)), sec('TELL', 2, () => h('div', null, e.tell)), sec('HOW TO BEAT IT', 3, () => h('div', { class: 'quote' }, e.counter)));
      p.append(sec('VARIANTS', 2, () => h('div', { class: 'kin' }, e.variants.map((v, i) => { const sh = r >= 2 + (i > 0 ? 1 : 0), sp = B.assets.sprites[v]; return h('div', { class: 'mini' }, B.sprite(v, { scale: Math.max(2, Math.floor(48 / Math.max(sp.fw, sp.fh))), sil: !sh }), sh ? (i === 0 ? 'Common' : 'Rare') : '???'); }))));
    } else {
      p.append(sec('ABILITY', 2, () => h('div', null, e.ability, e.dash ? h('div', { class: 'hint2' }, 'Dash: ' + e.dash + '.') : null)));
      p.append(sec('UPGRADES', 3, () => h('div', { class: 'ups' }, e.upgrades.map((u) => h('div', { class: 'up' }, h('b', null, u.name), h('span', null, u.detail))))));
      p.append(sec('KIN', 2, () => {
        const box = h('div', { style: { display: 'grid', gap: '10px' } });
        for (const ev of (e.kind === 'creature' ? B.childrenOf(e.id) : [e])) { const [a, b2] = ev.parents || [e.id, e.id]; if (!ev.parents) continue; box.append(h('div', { class: 'kin' }, mini(ev.parents[0], B.rank(ev.parents[0]) >= 1), h('span', { class: 'op' }, '+'), mini(ev.parents[1], B.rank(ev.parents[1]) >= 1), h('span', { class: 'op' }, '='), mini(ev.id, B.rank(ev.id) >= 2))); }
        if (e.kind === 'creature') for (const sy of B.synergiesOf(e.id)) { const pt = sy.a === e.id ? sy.b : sy.a; box.append(h('div', { class: 'kin' }, mini(pt, B.rank(pt) >= 1), r >= 3 ? h('div', null, h('b', { class: 'px', style: { color: 'var(--gold)', fontWeight: 400 } }, sy.name), h('br'), h('span', { class: 'hint2' }, sy.detail)) : lock(e, 3))); }
        if (!box.children.length) box.append(h('div', { class: 'hint2' }, 'No recipe or combo known.'));
        return box;
      }));
    }
    p.append(sec('FIELD NOTE', 2, () => h('div', { class: 'quote' }, e.flavor)));
    p.append(sec('NOTE II', 4, () => h('div', { class: 'quote' }, e.lore)));
    if (r >= 2) p.append(h('div', { class: 'rowflex' }, h('dl', { class: 'facts' }, e.facts.flatMap(([a, b2]) => [h('dt', null, a), h('dd', null, b2)])), h('div', { class: 'radar', html: B.radar(e.id, { size: 150 }) })));
    ov.replaceChildren(h('button', { class: 'xbtn', onclick: closeInspect }, 'X'), h('div', { class: 'ovbox' }, stage, p));
  }
  document.addEventListener('keydown', (ev) => {
    if (!inspect) return;
    if (ev.key === 'Escape') closeInspect(); if (ev.key === 'ArrowRight') step(1); if (ev.key === 'ArrowLeft') step(-1);
    if (ev.key === ' ' || ev.key === 'f') { ev.preventDefault(); flipped = !flipped; document.querySelector('.stagecard .card')?.classList.toggle('flipped', flipped); }
  });
  $('ov').addEventListener('click', (ev) => { if (ev.target === $('ov') || ev.target.classList.contains('ovbox')) closeInspect(); });

  /* Demo: discover the next missing card with the flip-in reveal */
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act="discover"]'); if (!b) return;
    const next = B.ENTRIES.find((e) => B.rank(e.id) < 2 && matches(e)); if (!next) return;
    justRevealed = next.id; B.setRank(next.id, 2);
    setTimeout(() => document.querySelector(`.card[data-id="${next.id}"]`)?.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }), 50);
  });
  B.onChange((why) => { if (!why.id) justRevealed = null; render(); });
  addEventListener('resize', layout);
  tilt($('sections'), 12);
  B.demoBar({ extra: '<button data-act="discover">Discover next</button>' });
  render();
})();
</script>
</body>
