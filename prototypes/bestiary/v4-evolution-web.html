<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bestiary 4 - Evolution Web</title>
<style>
  /* Direction 4: a constellation. Creatures are stars. Gold arrows are evolution recipes, teal dashes are
     party combos. What you have not found stays dim, but the gaps show you where to look.
     Foes switch to a timeline of when they arrive and who calls whom. */
  :root{
    --bg:#060b1a; --panel:#0b1330; --panel2:#101a3f; --line:#26407a; --cy:#5ee7ff; --gold:#ffd36b; --txt:#e8f0ff; --mut:#8ea3d0; --pink:#ff7ad9;
    --sil-filter:brightness(0) invert(.17) sepia(.5) hue-rotate(190deg) saturate(2.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{color:var(--txt);font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);
    background-image:
      radial-gradient(1px 1px at 12% 18%,#fff9,transparent),radial-gradient(1px 1px at 78% 12%,#fff8,transparent),radial-gradient(2px 2px at 40% 70%,#9bd8ff88,transparent),
      radial-gradient(1px 1px at 88% 66%,#fff8,transparent),radial-gradient(1px 1px at 24% 88%,#fff7,transparent),radial-gradient(2px 2px at 62% 30%,#ffd36b66,transparent),
      radial-gradient(900px 500px at 70% 0,#14245a,transparent 70%),radial-gradient(700px 500px at 0 100%,#1b1048,transparent 70%);
    background-size:340px 300px,420px 380px,290px 260px,360px 340px,310px 330px,500px 420px,100% 100%,100% 100%}
  button{font:inherit;color:inherit;cursor:pointer}
  .px{font-family:NovelMix,ui-monospace,monospace;-webkit-font-smoothing:none;font-smooth:never;line-height:1.15}

  .wrap{max-width:1360px;margin:0 auto;padding:14px 14px 90px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
  .top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
  .top h1{margin:0;font:400 36px/1 NovelMix;color:var(--cy);text-shadow:0 0 18px #5ee7ff66}
  .seg{display:flex;border:2px solid var(--line);background:#0006}
  .seg button{background:none;border:0;padding:4px 16px;font:18px/1.2 NovelMix;color:var(--mut)}
  .seg button.on{background:var(--cy);color:#04141c}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .stat{border:2px solid var(--line);background:#0006;padding:2px 10px;font:18px/1.3 NovelMix;color:var(--mut)}
  .stat b{font-weight:400;color:var(--gold)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);align-items:center;width:100%}
  .legend i{display:inline-block;width:26px;height:0;vertical-align:middle;margin-right:5px}
  .l-evo{border-top:4px solid var(--gold)} .l-unk{border-top:4px dotted #ffd36b88} .l-syn{border-top:3px dashed var(--cy)}

  .map{position:relative;width:100%;border:2px solid var(--line);background:#050a1888;overflow:hidden}
  .map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .zone{position:absolute;border:2px dashed #26407a99;background:#0b133055;border-radius:18px;pointer-events:none}
  .zone span{position:absolute;left:8px;top:-12px;background:var(--bg);padding:0 6px;white-space:nowrap;font:18px/1.2 NovelMix;color:#5a74b3}
  .plabel{position:absolute;transform:translateX(-50%);font:18px/1.2 NovelMix;color:#5a74b3;white-space:nowrap;pointer-events:none}
  .evo{stroke:var(--gold);fill:none;stroke-linecap:round}
  .evo.found{stroke-width:4;stroke-dasharray:10 8;animation:flow 1s linear infinite;filter:drop-shadow(0 0 5px #ffd36b)}
  .evo.hint{stroke:#ffd36b88;stroke-width:3;stroke-dasharray:1 9}
  .evo.faint{opacity:.28}
  .syn{fill:none;stroke:var(--cy);stroke-linecap:round}
  .syn.found{stroke-width:3;stroke-dasharray:9 7;filter:drop-shadow(0 0 4px #5ee7ff)}
  .syn.hint{stroke-width:2;stroke-dasharray:4 9;opacity:.55}
  .syn.faint{opacity:.2}
  .call{fill:none;stroke:var(--pink);stroke-width:3;stroke-dasharray:3 8;stroke-linecap:round;animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .dimmed{opacity:.1!important}
  .draw{animation:draw 1.1s ease-out both,flow 1s linear 1.1s infinite;stroke-dashoffset:0}
  @keyframes draw{from{stroke-dasharray:600;stroke-dashoffset:600}to{stroke-dasharray:600;stroke-dashoffset:0}}
  .elabel{position:absolute;transform:translate(-50%,-50%);font:18px/1.1 NovelMix;padding:1px 8px;background:#050a18;border:2px solid var(--cy);color:var(--cy);white-space:nowrap;pointer-events:none}
  .elabel.q{border-color:#3a4f86;color:#5a74b3}
  .elabel.g{border-color:var(--gold);color:var(--gold)}

  .node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:130px;z-index:2}
  .med{width:var(--n);height:var(--n);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;
    background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--tc) 40%,#0a1230),#080e24 75%);
    border:3px solid var(--tc);box-shadow:0 0 0 3px #060b1a,0 0 18px color-mix(in srgb,var(--tc) 60%,transparent);transition:transform .15s}
  .node:hover .med{transform:scale(1.08)}
  .node.evo .med{border-width:4px;box-shadow:0 0 0 3px #060b1a,0 0 0 6px color-mix(in srgb,var(--tc) 55%,transparent),0 0 24px color-mix(in srgb,var(--tc) 70%,transparent);border-radius:30%}
  .node.r0 .med{border-color:#2a3d73;box-shadow:0 0 0 3px #060b1a;background:#0a1230}
  .node.r1 .med{border-color:#3f568f;box-shadow:0 0 0 3px #060b1a;background:#0c1538}
  .node.r4 .med{border-color:var(--gold)}
  .node.sel .med{transform:scale(1.14);box-shadow:0 0 0 3px #060b1a,0 0 0 6px #fff,0 0 28px #fff8}
  .node.dim{opacity:.22}
  .node .q{font:27px/1 NovelMix;color:#3a4f86}
  .lbl{font:18px/1.1 NovelMix;text-shadow:2px 0 #060b1a,-2px 0 #060b1a,0 2px #060b1a,0 -2px #060b1a;max-width:130px;text-align:center;white-space:nowrap;color:var(--txt)}
  .node.r0 .lbl,.node.r1 .lbl{color:#6a7fb5}
  .tag{position:absolute;top:-8px;right:-14px;background:var(--gold);color:#2a1d00;font:18px/1 NovelMix;padding:1px 6px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.4}}
  .burst{animation:burst .9s cubic-bezier(.3,1.6,.5,1)}
  @keyframes burst{0%{transform:scale(.2);filter:brightness(4)}60%{transform:scale(1.25)}100%{transform:none;filter:none}}

  /* Side panel */
  .panel{position:sticky;top:12px;background:var(--panel);border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .panel .hd{display:flex;gap:12px;align-items:center}
  .panel h2{margin:0;font:400 27px/1.05 NovelMix}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .chip{padding:0 8px;border:2px solid var(--c,#5a74b3);background:color-mix(in srgb,var(--c,#5a74b3) 20%,#0b1330);font:18px/1.35 NovelMix}
  .panel h4{margin:0 0 5px;font:18px/1 NovelMix;color:var(--gold);letter-spacing:1px}
  .empty{color:var(--mut);text-align:center;padding:24px 8px}
  .rowx{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel2);border:2px solid var(--line);padding:8px 10px;margin-bottom:6px}
  .mini{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;font-size:12px;color:var(--mut);min-width:54px}
  .mini:hover{color:#fff}
  .mini .q{width:44px;height:44px;border:2px dashed #3a4f86;display:flex;align-items:center;justify-content:center;font:27px NovelMix;color:#3a4f86}
  .op{font:27px NovelMix;color:var(--mut)}
  .up{background:var(--panel2);border-left:4px solid var(--tc);padding:4px 10px;margin-bottom:5px}
  .up b{display:block;font:18px/1.2 NovelMix} .up span{color:var(--mut);font-size:13px}
  .lock{background:repeating-linear-gradient(115deg,#1a2a5c 0 6px,#213570 6px 12px);border:2px dashed #3a4f86;color:#7f95cf;padding:5px 10px;font:18px/1.2 NovelMix;display:flex;justify-content:space-between;gap:10px}
  .quote{font-style:italic;color:#cbd8f7;border-left:3px solid var(--tc);padding-left:10px}
  .mut{color:var(--mut)}
  .close{display:none}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0}
  .facts dt{color:var(--mut)} .facts dd{margin:0;font:18px/1.2 NovelMix;color:var(--gold)}
  .rad{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .radar{color:var(--mut);width:140px}.radar svg{width:100%;height:auto}

  @media(max-width:900px){
    .wrap{grid-template-columns:1fr}
    .top h1{font-size:27px}
    .stats{margin-left:0}
    .panel:not(.open){display:none}
    .legend span:last-child{display:none}
    .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:58vh;z-index:40;border-left:0;border-right:0;border-bottom:0;transform:translateY(105%);transition:transform .25s;padding-bottom:84px}
    .panel.open{transform:none}
    .close{display:block;position:absolute;right:10px;top:8px;background:#0006;border:2px solid var(--line);font:18px NovelMix;padding:0 10px}
    .desk-only{display:none}
  }
  @media(prefers-reduced-motion:reduce){.evo.found,.call,.draw,.burst,.tag{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="px">WEB</h1>
    <div class="seg" id="layers"></div>
    <div class="stats" id="stats"></div>
    <div class="legend" id="legend"></div>
  </header>
  <main class="map" id="map"></main>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<script src="bestiary-assets.js"></script>
<script src="bestiary-data.js"></script>
<script>
(() => {
  const B = Bestiary, h = B.h, T = B.TYPES, NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  let layer = 'allies', sel = null, justFound = null;

  /* Hand-placed layouts (viewBox units). Wide for desktop, tall for phones. */
  const LAYOUT = {
    allies: {
      wide: { w: 1000, h: 780, n: 72, big: 84,
        pos: { cat: [215, 85], octopus: [105, 225], mollusc: [65, 370], axolotl: [105, 515], frog: [215, 665], spider: [365, 370],
          salamander: [545, 105], beast: [545, 310], reptile: [750, 210], owl: [545, 515], storm: [545, 690], tengu: [750, 600],
          mouse: [904, 120], mole: [904, 390], bear: [904, 660] },
        zones: [[16, 22, 420, 750, 'THE INK RING'], [462, 22, 360, 380, 'FIRE LINE'], [462, 422, 360, 330, 'STORM LINE'], [818, 22, 172, 750, 'LOOSE ENDS']] },
      tall: { w: 400, h: 1090, n: 60, big: 68,
        pos: { cat: [200, 70], octopus: [100, 170], mollusc: [62, 285], axolotl: [100, 400], frog: [200, 500], spider: [328, 285],
          salamander: [80, 620], beast: [80, 740], reptile: [275, 680], owl: [80, 860], storm: [80, 980], tengu: [275, 920] ,
          mouse: [70, 1045], mole: [200, 1045], bear: [330, 1045] },
        zones: [[8, 14, 384, 540, 'THE INK RING'], [8, 575, 384, 215, 'FIRE LINE'], [8, 805, 384, 215, 'STORM LINE'], [8, 1000, 384, 86, 'LOOSE ENDS']] }
    },
    foes: {
      wide: { w: 1000, h: 680, n: 80, big: 110,
        pos: { golem: [75, 340], demon: [250, 130], mage: [250, 340], gladiator: [250, 550], shaman: [460, 225], hunter: [460, 455], skeleton: [680, 135], lion: [680, 315], guardian: [890, 340] },
        labels: [[75, 22, 'START'], [250, 22, 'DENS'], [460, 22, '1:30-2:00'], [680, 22, 'CALLED'], [890, 22, 'BOSS 9:30']] },
      tall: { w: 400, h: 960, n: 62, big: 78,
        pos: { golem: [200, 90], demon: [75, 250], mage: [200, 250], gladiator: [325, 250], shaman: [110, 430], hunter: [290, 430], skeleton: [80, 620], lion: [200, 620], guardian: [200, 810] },
        labels: [[200, 22, 'START'], [200, 168, 'DENS & WAVES'], [200, 348, '1:30-2:00'], [200, 528, 'CALLED IN'], [200, 718, 'BOSS 9:30']] }
    }
  };
  const isTall = () => innerWidth <= 900;
  const L = () => LAYOUT[layer][isTall() ? 'tall' : 'wide'];
  const ids = () => B.ENTRIES.filter((e) => (layer === 'foes') === (e.kind === 'foe')).map((e) => e.id);

  /* Edges derived from the game data */
  function edges() {
    const out = [];
    if (layer === 'allies') {
      for (const e of B.byKind('evolution')) for (const p of e.parents) out.push({ t: 'evo', a: p, b: e.id, evo: e.id });
      for (const s of B.SYNERGIES) out.push({ t: 'syn', a: s.a, b: s.b, syn: s });
    } else for (const e of B.byKind('foe')) for (const c of e.calls || []) out.push({ t: 'call', a: e.id, b: c });
    return out;
  }
  const rk = B.rank;
  const edgeState = (ed) => {
    if (ed.t === 'evo') { const found = rk(ed.evo) >= 2; return { found, faint: !found && rk(ed.a) < 1 && rk(ed.b) < 1 }; }
    if (ed.t === 'syn') { const found = rk(ed.a) >= 3 || rk(ed.b) >= 3; return { found, faint: rk(ed.a) < 1 || rk(ed.b) < 1 }; }
    return { found: rk(ed.a) >= 2, faint: false };
  };

  /* ---------- Draw ---------- */
  function draw() {
    const map = $('map'), lay = L(), W = map.clientWidth || 1000, sc = W / lay.w, H = lay.h * sc;
    map.style.height = H + 'px'; map.replaceChildren();
    const P = (id) => ({ x: lay.pos[id][0] * sc, y: lay.pos[id][1] * sc });
    const nodeR = (id) => ((B.BY_ID[id].kind === 'evolution' || id === 'guardian') ? lay.big : lay.n) / 2;
    // zones and phase labels
    for (const [x, y, w, hh, t] of lay.zones || []) map.append(h('div', { class: 'zone', style: { left: x * sc + 'px', top: y * sc + 'px', width: w * sc + 'px', height: hh * sc + 'px' } }, h('span', null, t)));
    for (const [x, y, t] of lay.labels || []) map.append(h('div', { class: 'plabel', style: { left: x * sc + 'px', top: y * sc + 'px' } }, t));
    // edges
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd36b"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd36b88"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7ad9"/></marker></defs>`;
    const labels = [];
    for (const ed of edges()) {
      const a = P(ed.a), b = P(ed.b), dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      const pad = (id) => nodeR(id) + 8, bend = ed.t === 'evo' ? 0.1 : 0.0;
      const x1 = a.x + ux * pad(ed.a), y1 = a.y + uy * pad(ed.a), x2 = b.x - ux * (pad(ed.b) + (ed.t === 'syn' ? 0 : 4)), y2 = b.y - uy * (pad(ed.b) + (ed.t === 'syn' ? 0 : 4));
      if (ed.t === 'syn') { const x1b = a.x + ux * pad(ed.a), y1b = a.y + uy * pad(ed.a); ed.p = [x1b, y1b, b.x - ux * pad(ed.b), b.y - uy * pad(ed.b)]; }
      const cx = (x1 + x2) / 2 - uy * len * bend, cy = (y1 + y2) / 2 + ux * len * bend;
      const st = edgeState(ed), path = document.createElementNS(NS, 'path');
      const p = ed.p || [x1, y1, x2, y2];
      path.setAttribute('d', `M${p[0]},${p[1]} Q${cx},${cy} ${p[2]},${p[3]}`);
      path.dataset.a = ed.a; path.dataset.b = ed.b;
      if (ed.t === 'evo') { path.setAttribute('class', 'evo ' + (st.found ? 'found' : 'hint') + (st.faint ? ' faint' : '') + (justFound === ed.evo ? ' draw' : '')); path.setAttribute('marker-end', st.found ? 'url(#ah)' : 'url(#ahd)'); }
      else if (ed.t === 'syn') { path.setAttribute('class', 'syn ' + (st.found ? 'found' : 'hint') + (st.faint ? ' faint' : '')); labels.push({ x: cx, y: cy, ed, st }); }
      else { path.setAttribute('class', 'call' + (st.found ? '' : ' faint')); path.setAttribute('marker-end', 'url(#ahp)'); path.style.opacity = st.found ? 1 : 0.3; }
      svg.append(path);
    }
    map.append(svg);
    for (const l of labels) if (!l.st.faint || sel) map.append(h('div', { class: 'elabel px ' + (l.st.found ? '' : 'q') + (l.st.faint ? ' dimmed' : ''), style: { left: l.x + 'px', top: l.y + 'px' }, 'data-a': l.ed.a, 'data-b': l.ed.b }, l.st.found ? l.ed.syn.name : '?'));
    // nodes
    for (const id of ids()) {
      const e = B.BY_ID[id], r = rk(id), p = P(id), big = e.kind === 'evolution' || id === 'guardian', n = big ? lay.big : lay.n, tc = r >= 2 ? T[e.type].color : '#3f568f';
      const s = B.assets.sprites[id], scale = Math.max(1, Math.floor(0.7 * n / Math.max(s.fw, s.fh)));
      const med = h('div', { class: 'med' }, r === 0 ? h('span', { class: 'q' }, '?') : B.sprite(id, { scale, sil: r < 2 }));
      if (B.isNew(id)) med.append(h('span', { class: 'tag' }, 'NEW'));
      if (justFound === id) med.classList.add('burst');
      const nm = e.kind === 'evolution' && r < 2 ? '???' : B.shownName(id);
      const node = h('button', { class: `node r${r}${big && e.kind === 'evolution' ? ' evo' : ''}${sel === id ? ' sel' : ''}`, style: { left: p.x + 'px', top: p.y + 'px', '--n': n + 'px', '--tc': tc }, 'data-id': id, 'aria-label': nm, onclick: () => select(id) }, med, h('span', { class: 'lbl' }, nm));
      map.append(node);
    }
    applyFocus();
  }
  function applyFocus() {
    const map = $('map'), near = new Set(sel ? [sel] : []);
    if (sel) for (const ed of edges()) { if (ed.a === sel) near.add(ed.b); if (ed.b === sel) near.add(ed.a); if (ed.t === 'evo' && (ed.evo === sel)) { near.add(ed.a); } }
    map.querySelectorAll('.node').forEach((n) => n.classList.toggle('dim', !!sel && !near.has(n.dataset.id)));
    map.querySelectorAll('svg path').forEach((p) => p.classList.toggle('dimmed', !!sel && !(p.dataset.a === sel || p.dataset.b === sel)));
    map.querySelectorAll('.elabel').forEach((l) => l.classList.toggle('dimmed', !!sel && !(l.dataset.a === sel || l.dataset.b === sel)));
  }

  /* ---------- Header ---------- */
  function renderTop() {
    const lay = $('layers'); lay.replaceChildren();
    for (const [k, l] of [['allies', 'CREATURES'], ['foes', 'FOES']]) lay.append(h('button', { class: k === layer ? 'on' : '', onclick: () => { layer = k; sel = null; renderAll(); } }, l));
    const evos = B.byKind('evolution'), found = evos.filter((e) => rk(e.id) >= 2).length;
    const combos = B.SYNERGIES.filter((s) => rk(s.a) >= 3 || rk(s.b) >= 3).length;
    const loners = B.byKind('creature').filter((e) => !B.childrenOf(e.id).length && !B.synergiesOf(e.id).length).length;
    const st = $('stats'); st.replaceChildren(
      h('div', { class: 'stat' }, 'RECIPES ', h('b', null, found + '/' + evos.length)), h('div', { class: 'stat' }, 'COMBOS ', h('b', null, combos + '/' + B.SYNERGIES.length)),
      h('div', { class: 'stat', title: 'Creatures with no known recipe or combo yet' }, 'LOOSE ENDS ', h('b', null, loners)));
    $('legend').innerHTML = layer === 'allies'
      ? '<span><i class="l-evo"></i>Evolution (found)</span><span><i class="l-unk"></i>Recipe not found</span><span><i class="l-syn"></i>Party combo</span><span style="color:#5a74b3">Dim stars are unmet. Tap one to open it.</span>'
      : '<span><i style="border-top:3px dotted #ff7ad9"></i>Calls in helpers</span><span style="color:#5a74b3">Columns show when each foe arrives. Dens and waves have no fixed time.</span>';
  }

  /* ---------- Panel ---------- */
  const mini = (id, shown, on) => h('button', { class: 'mini', onclick: on || (() => { const e = B.BY_ID[id]; if ((e.kind === 'foe') !== (layer === 'foes')) layer = e.kind === 'foe' ? 'foes' : 'allies'; select(id); }) },
    shown ? B.portrait(id, { size: 44 }) : h('div', { class: 'q' }, '?'), shown ? B.BY_ID[id].name : '???');
  const lock = (e, min) => h('div', { class: 'lock' }, h('span', null, '▒▒▒▒▒▒▒'), h('span', null, B.KINDS[e.kind].ranks[min].toUpperCase()));
  function renderPanel() {
    const p = $('panel'); p.replaceChildren();
    if (!sel) { p.classList.remove('open'); p.append(h('div', { class: 'empty px' }, layer === 'allies' ? 'SELECT A STAR' : 'SELECT A FOE'), h('div', { class: 'empty', style: { paddingTop: 0 } }, layer === 'allies' ? 'Tap a creature to see its recipes, combos and upgrades.' : 'Tap a foe to see how it behaves and who it calls.')); return; }
    const e = B.BY_ID[sel], r = rk(sel), tc = r >= 2 ? T[e.type].color : '#3f568f';
    p.classList.add('open'); p.style.setProperty('--tc', tc);
    const sec = (title, min, build) => h('div', null, h('h4', null, title), r >= min ? build() : lock(e, min));
    p.append(h('button', { class: 'close', onclick: () => { sel = null; renderAll(); } }, 'X'));
    p.append(h('div', { class: 'hd' }, B.portrait(sel, { size: 76, sil: r < 2 }), h('div', null, h('h2', null, e.kind === 'evolution' && r < 2 ? '???' : B.shownName(sel)),
      h('div', { class: 'chips' }, r >= 2 ? [h('span', { class: 'chip', style: { '--c': tc } }, T[e.type].name.toUpperCase()), h('span', { class: 'chip' }, e.role.toUpperCase())] : h('span', { class: 'chip' }, '??? '), h('span', { class: 'chip', style: { '--c': r >= 4 ? '#ffd36b' : '#5a74b3' } }, B.KINDS[e.kind].ranks[r].toUpperCase())))));
    if (r < 2) p.append(h('div', { class: 'mut' }, r === 0 ? (e.kind === 'evolution' ? 'Merge two creatures on an expedition to find this form.' : 'Not met yet.') : e.kind === 'foe' ? 'Spotted. Defeat one to study it.' : e.kind === 'evolution' ? 'A recipe may exist for these parents.' : 'Spotted at a den. Capture one to study it.'));

    // Links: the point of this layout
    if (e.kind === 'creature') {
      const evos = B.childrenOf(sel), syn = B.synergiesOf(sel);
      p.append(h('div', null, h('h4', null, 'EVOLVES WITH'), evos.length ? evos.map((ev) => { const pt = ev.parents.find((x) => x !== sel); return h('div', { class: 'rowx' }, mini(sel, true, () => {}), h('span', { class: 'op' }, '+'), mini(pt, rk(pt) >= 1), h('span', { class: 'op' }, '='), mini(ev.id, rk(ev.id) >= 2)); }) : h('div', { class: 'mut' }, 'No recipe yet. A loose end.')));
      p.append(h('div', null, h('h4', null, 'COMBOS'), syn.length ? syn.map((s) => { const pt = s.a === sel ? s.b : s.a; return h('div', { class: 'rowx' }, mini(pt, rk(pt) >= 1), r >= 3 || rk(pt) >= 3 ? h('div', null, h('b', { class: 'px', style: { color: 'var(--cy)', fontWeight: 400 } }, s.name), h('br'), h('span', { class: 'mut' }, s.detail)) : h('div', { class: 'lock', style: { flex: 1 } }, h('span', null, '▒▒▒▒▒▒'), h('span', null, 'STUDIED'))); }) : h('div', { class: 'mut' }, 'No combo known.')));
    } else if (e.kind === 'evolution') {
      p.append(h('div', null, h('h4', null, 'RECIPE'), h('div', { class: 'rowx' }, mini(e.parents[0], rk(e.parents[0]) >= 1), h('span', { class: 'op' }, '+'), mini(e.parents[1], rk(e.parents[1]) >= 1), h('span', { class: 'op' }, '='), mini(sel, true, () => {})), r >= 2 ? h('div', { class: 'mut' }, '+' + e.hp + ' party HP. ' + e.bonus + '. Keeps upgrades from both parents.') : h('div', { class: 'lock' }, h('span', null, '▒▒▒▒▒▒▒▒'), h('span', null, 'DISCOVERED'))));
    } else {
      const callers = B.byKind('foe').filter((x) => (x.calls || []).includes(sel));
      p.append(h('div', null, h('h4', null, 'ARRIVES'), h('div', null, e.appears)));
      if ((e.calls || []).length) p.append(h('div', null, h('h4', null, 'CALLS IN'), h('div', { class: 'rowx' }, e.calls.map((c) => mini(c, rk(c) >= 1)))));
      if (callers.length) p.append(h('div', null, h('h4', null, 'CALLED BY'), h('div', { class: 'rowx' }, callers.map((c) => mini(c.id, rk(c.id) >= 1)))));
    }
    if (e.kind === 'foe') {
      p.append(sec('BEHAVIOUR', 2, () => h('div', null, e.behavior)), sec('TELL', 2, () => h('div', null, e.tell)), sec('HOW TO BEAT IT', 3, () => h('div', { class: 'quote' }, e.counter)));
    } else {
      p.append(sec('ABILITY', 2, () => h('div', null, e.ability, e.dash ? h('div', { class: 'mut' }, 'Dash: ' + e.dash + '.') : null)));
      p.append(sec('UPGRADES', 3, () => h('div', null, e.upgrades.map((u) => h('div', { class: 'up' }, h('b', null, u.name), h('span', null, u.detail))))));
    }
    p.append(sec('FIELD NOTE', 2, () => h('div', { class: 'quote' }, e.flavor)), sec('NOTE II', 4, () => h('div', { class: 'quote' }, e.lore)));
    if (r >= 2) p.append(h('div', { class: 'rad' }, h('dl', { class: 'facts' }, e.facts.flatMap(([a, b]) => [h('dt', null, a), h('dd', null, b)])), h('div', { class: 'radar', html: B.radar(sel, { size: 140 }) })));
  }

  function select(id) { sel = sel === id && isTall() ? null : id; if (id) B.markViewed(id); renderAll(); }
  function renderAll() { renderTop(); draw(); renderPanel(); }

  /* Demo: merge the next undiscovered evolution and draw its recipe in */
  document.addEventListener('click', (ev) => {
    if (!ev.target.closest('[data-act="merge"]')) return;
    const next = B.byKind('evolution').find((e) => rk(e.id) < 2); if (!next) return;
    if (layer !== 'allies') layer = 'allies';
    for (const p of next.parents) if (rk(p) < 2) B.setRank(p, 2);
    justFound = next.id; sel = next.id; B.setRank(next.id, 2);
  });
  B.onChange((why) => { if (!why.id) justFound = null; renderAll(); if (justFound) setTimeout(() => { justFound = null; }, 1500); });
  new ResizeObserver(() => { const m = $('map'); if (m.dataset.w !== String(m.clientWidth)) { m.dataset.w = m.clientWidth; draw(); } }).observe($('map'));
  B.demoBar({ extra: '<button data-act="merge">Merge next</button>' });
  renderAll();
})();
