<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bestiary 1 - Field Guide</title>
<style>
  /* Direction 1: the classic dex. List on one side, a big animated portrait on the other.
     Styled to match the game's DarkMode UI (ink panels, NovelMix at 9px multiples, gold/teal/danger accents). */
  :root{
    --ink:#120a1a; --deep:#0b0710; --panel:#1b1228; --line:#3b2d55; --line2:#55417a;
    --gold:#ffc41b; --teal:#2dc5c0; --danger:#ef5266; --muted:#b9b0d0; --text:#fff;
    --sil-filter:brightness(0) invert(.2) sepia(.6) hue-rotate(215deg) saturate(2.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(1200px 700px at 70% -10%,#2a1b44 0,transparent 60%),radial-gradient(900px 600px at 0 100%,#1f1230 0,transparent 55%),var(--deep);
    color:var(--text);font:18px/1.3 NovelMix,ui-monospace,monospace;-webkit-font-smoothing:none;font-smooth:never}
  button{font:inherit;color:inherit;cursor:pointer}
  .ol{text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink)}
  .muted{color:var(--muted)} .gold{color:var(--gold)} .teal{color:var(--teal)} .danger{color:var(--danger)}

  /* Notched pixel panel */
  .px{background:var(--ink);border:4px solid var(--line);
    clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
  .px.hi{border-color:var(--line2)}

  .app{max-width:1280px;margin:0 auto;padding:16px 16px 76px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
  @media(min-width:821px){.app{height:100vh;min-height:0}}

  /* Header */
  .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .banner{padding:4px 22px;font-size:27px;color:var(--gold);letter-spacing:2px;background:#241636;border-color:var(--line2)}
  .meter{flex:1;min-width:210px;display:flex;flex-direction:column;gap:4px}
  .meter .row{display:flex;justify-content:space-between;gap:12px}
  .bar{height:12px;background:#07040b;border:2px solid var(--line);position:relative}
  .bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(var(--teal),#1b8e8a)}
  .bar>b{position:absolute;left:0;top:0;bottom:0;background:var(--gold);opacity:.95}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{background:var(--ink);border:4px solid var(--line);padding:2px 12px;color:var(--muted);display:flex;gap:10px;align-items:center}
  .tab.on{border-color:var(--gold);color:var(--text);background:#2a1d3d}
  .tab small{font-size:18px;color:var(--teal)}

  /* Main layout */
  .main{display:grid;grid-template-columns:minmax(310px,390px) 1fr;gap:12px;flex:1;min-height:0}
  .main>*{min-width:0}
  .list{display:flex;flex-direction:column;min-height:0}
  .filters{padding:8px 10px;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;border-bottom:4px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--line2) var(--ink)}
  .filters .chip{flex:none}
  .chip{background:#0f0817;border:2px solid var(--line);padding:0 8px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;line-height:24px}
  .chip.on{border-color:var(--gold);color:var(--text)}
  .chip i{width:10px;height:10px;display:inline-block;background:var(--c,#888)}
  .rows{overflow:auto;padding:6px;display:flex;flex-direction:column;gap:4px;flex:1;scrollbar-color:var(--line2) var(--ink)}
  .rowb{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;background:#17102300;border:2px solid transparent;text-align:left;width:100%}
  .rowb:hover{background:#241636}
  .rowb.on{background:#2a1d3d;border-color:var(--gold)}
  .rowb .q{width:38px;height:38px;flex:none;background:#0f0817;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .rowb .t{flex:1;min-width:0;display:flex;flex-direction:column}
  .rowb .t small{color:var(--muted);font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowb .dot{width:12px;height:12px;flex:none;background:var(--c)}
  .new{color:var(--gold);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  .pips{display:inline-flex;gap:3px}
  .pips i{width:10px;height:10px;background:#07040b;border:2px solid var(--line)}
  .pips i.on{background:var(--gold);border-color:#a87d00}
  .empty{padding:20px;text-align:center;color:var(--muted)}

  /* Detail */
  .detail{min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;scrollbar-color:var(--line2) var(--ink)}
  .backbar{display:none}
  .top{display:grid;grid-template-columns:minmax(220px,290px) 1fr;gap:12px}
  .stage{position:relative;aspect-ratio:1;min-height:240px;border:4px solid var(--line2);overflow:hidden;
    background:
      radial-gradient(circle at 50% 78%,color-mix(in srgb,var(--tc) 60%,transparent) 0,transparent 62%),
      repeating-linear-gradient(0deg,#ffffff06 0 4px,transparent 4px 8px),
      linear-gradient(#150d20,#241636)}
  .stage .no{position:absolute;left:10px;top:6px;color:var(--muted)}
  .stage .cry{position:absolute;right:8px;top:8px;width:40px;height:40px;background:#0f0817;border:3px solid var(--line2);color:var(--gold);font-size:18px}
  .stage .cry:active{transform:scale(.96)}
  .hero-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hero-wrap .shadow{position:absolute;bottom:16%;width:46%;height:16px;background:#000;opacity:.4;border-radius:50%;filter:blur(1px)}
  .hero{position:relative;z-index:1;animation:bob 1.2s steps(2) infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .hero.pop{animation:flip .3s steps(6) 1,bob 1.2s steps(2) .3s infinite}
  @keyframes flip{0%{transform:scaleX(1)}30%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
  .big-q{font-size:108px;color:var(--line2);position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .spark{position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--tc);animation:spark .6s steps(8) forwards;z-index:2}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
  .stage .rankpill{position:absolute;left:0;right:0;bottom:0;padding:4px 10px;background:#0b0710d0;display:flex;justify-content:space-between;align-items:center}

  .id{display:flex;flex-direction:column;gap:8px;min-width:0}
  .id h1{margin:0;font-size:36px;line-height:1;font-weight:400}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .tchip{display:inline-flex;align-items:center;gap:6px;padding:0 10px;line-height:26px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,#0f0817);color:#fff}
  .rchip{padding:0 10px;line-height:26px;border:3px solid var(--line2);background:#0f0817;color:var(--muted)}
  .idbody{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
  .facts dt{color:var(--muted)} .facts dd{margin:0;color:var(--gold)}
  .radar{color:var(--muted);width:170px;margin:0 auto;padding:14px 20px}
  @media(max-width:1100px) and (min-width:821px){.idbody{grid-template-columns:1fr}}
  .radar svg{width:100%;height:auto}

  .tabbar{display:flex;gap:6px;border-bottom:4px solid var(--line);padding-bottom:0;overflow-x:auto;scrollbar-width:none}
  .dt{flex:none}
  .dt{background:transparent;border:4px solid transparent;border-bottom:0;padding:2px 14px;color:var(--muted)}
  .dt.on{background:var(--ink);border-color:var(--line);color:var(--gold);margin-bottom:-4px;padding-bottom:6px}
  .pane{display:flex;flex-direction:column;gap:12px}
  .sec h3{margin:0 0 6px;font-size:18px;font-weight:400;color:var(--gold);letter-spacing:1px}
  .quote{padding:10px 12px;background:#17102a;border-left:6px solid var(--tc);color:#f3eefc}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .card{background:#17102a;border:3px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .card b{font-weight:400;color:var(--text)} .card span{color:var(--muted)}
  .redact{background:repeating-linear-gradient(135deg,#1f1530 0 8px,#27193c 8px 16px);border:3px dashed var(--line);color:var(--muted);padding:8px 10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .redact em{font-style:normal;color:var(--line2)}
  .recipe{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#17102a;border:3px solid var(--line);flex-wrap:wrap}
  .recipe .g{color:var(--muted)}
  .face{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
  .face small{color:var(--muted);font-size:18px}
  .face .q{width:56px;height:56px;background:#0f0817;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .steps{display:flex;flex-direction:column;gap:6px}
  .step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
  .step .ck{width:24px;height:24px;border:3px solid var(--line2);background:#07040b;display:flex;align-items:center;justify-content:center;color:#07040b}
  .step.done .ck{background:var(--teal);border-color:#17807c}
  .step.cur .ck{border-color:var(--gold)}
  .step small{display:block;color:var(--muted)}
  .prog{height:12px;background:#07040b;border:2px solid var(--line);margin-top:4px;max-width:340px}
  .prog>i{display:block;height:100%;background:var(--gold)}
  .hist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .hist div{background:#17102a;border:3px solid var(--line);padding:6px 10px}
  .hist b{display:block;font-weight:400;font-size:27px;color:var(--gold);line-height:1.1}
  .variants{display:flex;gap:12px;flex-wrap:wrap}

  @media(max-width:820px){
    .main{grid-template-columns:1fr}
    .detail{display:none}
    .app.open .list{display:none}
    .app.open .detail{display:flex;overflow:visible}
    .backbar{display:flex;justify-content:space-between;gap:8px}
    .backbar button{background:#0f0817;border:3px solid var(--line2);padding:2px 14px}
    .top{grid-template-columns:1fr}
    .dt{padding:2px 10px}
    .radar{width:140px;padding:8px 12px}
    .stage{max-width:340px;margin:0 auto;width:100%}
    .rows{overflow:visible}
    .hist{grid-template-columns:1fr 1fr 1fr}
    .hist b{font-size:18px}
  }
  @media(prefers-reduced-motion:reduce){.hero,.hero.pop{animation:none}.spark{display:none}.new{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <div class="px banner ol">BESTIARY</div>
    <div class="meter">
      <div class="row"><span>DISCOVERED <span class="gold" id="mk">0</span><span class="muted">/<span id="mt">0</span></span></span><span class="muted">MASTERED <span class="gold" id="mf">0</span></span></div>
      <div class="bar"><i id="bk"></i><b id="bf"></b></div>
    </div>
    <nav class="tabs" id="kinds"></nav>
  </header>
  <div class="main">
    <section class="px list"><div class="filters" id="filters"></div><div class="rows" id="rows" role="listbox" aria-label="Entries"></div></section>
    <section class="px detail" id="detail"></section>
  </div>
</div>
<script src="bestiary-assets.js"></script>
<script src="bestiary-data.js"></script>
<script>
(() => {
  const B = Bestiary, h = B.h, T = B.TYPES;
  let kind = 'creature', sel = 'cat', tab = 'about', typeFilter = null, missingOnly = false;
  const $ = (id) => document.getElementById(id);
  const app = $('app');

  const pips = (n) => h('span', { class: 'pips', title: 'Research rank ' + n + ' of 4' }, [1, 2, 3, 4].map((i) => h('i', { class: i <= n ? 'on' : '' })));
  const redact = (label, hint) => h('div', { class: 'redact' }, h('span', null, label), h('em', null, hint));
  const rankWord = (id) => B.rankName(id).toUpperCase();

  /* ---------- Header ---------- */
  function renderHead() {
    const t = B.totals();
    $('mk').textContent = t.known; $('mt').textContent = t.total; $('mf').textContent = t.full;
    $('bk').style.width = (t.known / t.total * 100) + '%'; $('bf').style.width = (t.full / t.total * 100) + '%';
    const kinds = $('kinds'); kinds.replaceChildren();
    for (const k of Object.keys(B.KINDS)) {
      const p = B.progress(B.byKind(k)[0].id);
      kinds.append(h('button', { class: 'tab' + (k === kind ? ' on' : ''), onclick: () => { kind = k; typeFilter = null; sel = visible()[0]?.id || B.byKind(k)[0].id; tab = 'about'; render(); } },
        B.KINDS[k].label.toUpperCase(), h('small', null, p.known + '/' + p.total)));
    }
  }

  /* ---------- List ---------- */
  const visible = () => B.byKind(kind).filter((e) => (!typeFilter || e.type === typeFilter) && (!missingOnly || B.rank(e.id) < 2));
  function renderList() {
    const f = $('filters'); f.replaceChildren();
    const types = [...new Set(B.byKind(kind).map((e) => e.type))];
    f.append(h('button', { class: 'chip' + (!typeFilter ? ' on' : ''), onclick: () => { typeFilter = null; render(); } }, 'ALL'));
    for (const ty of types) f.append(h('button', { class: 'chip' + (typeFilter === ty ? ' on' : ''), style: { '--c': T[ty].color }, onclick: () => { typeFilter = typeFilter === ty ? null : ty; render(); } }, h('i'), T[ty].name.toUpperCase()));
    f.append(h('button', { class: 'chip' + (missingOnly ? ' on' : ''), onclick: () => { missingOnly = !missingOnly; render(); } }, 'MISSING'));
    const rows = $('rows'); rows.replaceChildren();
    const list = visible();
    if (!list.length) rows.append(h('div', { class: 'empty' }, 'Nothing matches. Clear a filter.'));
    for (const e of list) {
      const r = B.rank(e.id), tc = T[e.type].color;
      const face = r === 0 ? h('div', { class: 'q' }, '?') : B.portrait(e.id, { size: 38, sil: r < 2 || (e.kind === 'evolution' && r < 2) });
      let sub = h('small', null, 'No.' + e.no);
      if (e.kind === 'evolution') sub = h('small', null, e.parents.map((p) => (B.rank(p) >= 1 ? B.BY_ID[p].name : '???')).join(' + '));
      rows.append(h('button', { class: 'rowb' + (e.id === sel ? ' on' : ''), role: 'option', 'aria-selected': e.id === sel, onclick: () => select(e.id, true) },
        face, h('span', { class: 't' }, h('span', { class: 'nm' }, B.shownName(e.id)), sub),
        B.isNew(e.id) ? h('span', { class: 'new' }, 'NEW') : null,
        r >= 2 ? h('span', { class: 'dot', style: { '--c': tc } }) : null, pips(r)));
    }
  }

  /* ---------- Detail ---------- */
  function spark(stage, color) {
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2, d = 70 + Math.random() * 50;
      const s = h('i', { class: 'spark', style: { '--tc': color, '--dx': Math.cos(a) * d + 'px', '--dy': Math.sin(a) * d + 'px' } });
      stage.append(s); setTimeout(() => s.remove(), 650);
    }
  }
  function stage(e, r, animate) {
    const tc = T[e.type].color;
    const st = h('div', { class: 'stage', style: { '--tc': r >= 2 ? tc : '#6b5a8f' } });
    st.append(h('span', { class: 'no' }, 'No.' + e.no));
    if (r >= 2) st.append(h('button', { class: 'cry', title: 'Play cry', 'aria-label': 'Play cry', onclick: () => B.cry(e.id) }, '♪'));
    if (r === 0) st.append(h('div', { class: 'big-q' }, '?'));
    else {
      const s = B.assets.sprites[e.id], scale = Math.max(2, Math.floor(190 / Math.max(s.fw, s.fh)));
      const spr = B.sprite(e.id, { scale, sil: r < 2 }); spr.classList.add('hero'); if (animate) spr.classList.add('pop');
      st.append(h('div', { class: 'hero-wrap' }, h('div', { class: 'shadow' }), spr));
      if (animate && r >= 2) setTimeout(() => spark(st, tc), 120);
    }
    st.append(h('div', { class: 'rankpill' }, h('span', { class: r >= 4 ? 'gold' : 'muted' }, rankWord(e.id)), pips(r)));
    return st;
  }
  function identity(e, r) {
    const tc = T[e.type].color, k = B.KINDS[e.kind];
    const box = h('div', { class: 'id' });
    box.append(h('h1', { class: 'ol' }, B.shownName(e.id)));
    if (r >= 2) box.append(h('div', { class: 'chips' }, h('span', { class: 'tchip', style: { '--c': tc } }, T[e.type].name.toUpperCase()), h('span', { class: 'rchip' }, e.role.toUpperCase()), e.kind === 'evolution' ? h('span', { class: 'rchip' }, 'EVOLUTION') : null));
    else box.append(h('div', { class: 'chips' }, h('span', { class: 'rchip' }, '??? TYPE'), h('span', { class: 'rchip' }, '??? ROLE')));
    box.append(h('p', { class: 'muted', style: { margin: 0 } }, r >= 2 ? e.blurb + '.' : hintText(e, r)));
    const body = h('div', { class: 'idbody' });
    body.append(r >= 2 ? h('dl', { class: 'facts' }, e.facts.flatMap(([a, b]) => [h('dt', null, a), h('dd', null, b)])) : h('div', { class: 'muted' }, 'Ratings unknown.'));
    body.append(h('div', { class: 'radar', html: B.radar(e.id, { size: 190, mask: r < 2 }) }));
    box.append(body);
    return box;
  }
  function hintText(e, r) {
    if (e.kind === 'evolution') return r === 0 ? 'Merge two creatures during an expedition to find this form.' : 'A recipe may exist for these parents. Merge them to find out.';
    if (e.kind === 'foe') return r === 0 ? 'Not met yet.' : 'Spotted. Defeat one to study it.';
    return r === 0 ? 'Not met yet. Find a den.' : 'Spotted near a den. Capture one to open its page.';
  }

  const lockFor = (e, min, what) => redact(what, 'Reach ' + B.KINDS[e.kind].ranks[min].toUpperCase());
  function paneAbout(e, r) {
    const p = h('div', { class: 'pane' });
    if (r < 2) { p.append(h('div', { class: 'sec' }, h('h3', null, 'FIELD NOTE'), redact('No data.', hintText(e, r)))); return p; }
    p.append(h('div', { class: 'sec' }, h('h3', null, 'FIELD NOTE I'), h('div', { class: 'quote' }, e.flavor)));
    p.append(h('div', { class: 'sec' }, h('h3', null, 'FIELD NOTE II'), r >= 4 ? h('div', { class: 'quote' }, e.lore) : lockFor(e, 4, '▒▒▒▒▒ ▒▒▒▒ ▒▒▒▒▒▒▒')));
    p.append(h('div', { class: 'sec' }, h('h3', null, e.kind === 'foe' ? 'APPEARS' : 'WHERE FOUND'), h('div', null, e.kind === 'foe' ? e.appears : e.where)));
    return p;
  }
  function paneMoves(e, r) {
    const p = h('div', { class: 'pane' });
    if (e.kind === 'foe') {
      p.append(h('div', { class: 'sec' }, h('h3', null, 'BEHAVIOUR'), r >= 2 ? h('div', null, e.behavior) : redact('No data.', 'Reach ' + B.KINDS.foe.ranks[2].toUpperCase())));
      p.append(h('div', { class: 'sec' }, h('h3', null, 'TELL'), r >= 2 ? h('div', null, e.tell) : redact('No data.', 'Reach ' + B.KINDS.foe.ranks[2].toUpperCase())));
      p.append(h('div', { class: 'sec' }, h('h3', null, 'HOW TO BEAT IT'), r >= 3 ? h('div', { class: 'quote' }, e.counter) : lockFor(e, 3, '▒▒▒▒▒▒ ▒▒▒▒▒▒▒▒')));
      return p;
    }
    p.append(h('div', { class: 'sec' }, h('h3', null, 'ABILITY'), r >= 2 ? h('div', null, e.ability) : redact('No data.', 'Reach ' + B.KINDS[e.kind].ranks[2].toUpperCase())));
    if (e.dash) p.append(h('div', { class: 'sec' }, h('h3', null, 'DASH'), r >= 2 ? h('div', null, e.dash) : redact('▒▒▒▒ ▒▒▒▒▒▒', 'Reach ' + B.KINDS[e.kind].ranks[2].toUpperCase())));
    p.append(h('div', { class: 'sec' }, h('h3', null, 'UPGRADES ' + (r >= 3 ? e.upgrades.length : '?')),
      h('div', { class: 'grid2' }, r >= 3 ? e.upgrades.map((u) => h('div', { class: 'card' }, h('b', null, u.name), h('span', null, u.detail)))
        : e.upgrades.map(() => redact('▒▒▒▒▒▒▒▒▒▒', 'STUDIED')))));
    return p;
  }
  const faceOrQ = (id, shown) => h('div', { class: 'face' }, shown ? B.portrait(id, { size: 56 }) : h('div', { class: 'q' }, '?'), h('small', null, shown ? B.BY_ID[id].name : '???'));
  function paneFamily(e, r) {
    const p = h('div', { class: 'pane' });
    if (e.kind === 'foe') {
      p.append(h('div', { class: 'sec' }, h('h3', null, 'VARIANTS'), h('div', { class: 'variants' }, e.variants.map((v, i) => {
        const shown = r >= 2 + (i > 0 ? 1 : 0), s = B.assets.sprites[v];
        return h('div', { class: 'face' }, B.sprite(v, { scale: Math.max(2, Math.floor(64 / Math.max(s.fw, s.fh))), sil: !shown }), h('small', null, shown ? (i === 0 ? 'Common' : 'Rare') : '???'));
      }))));
      return p;
    }
    if (e.kind === 'creature') {
      const evos = B.childrenOf(e.id);
      p.append(h('div', { class: 'sec' }, h('h3', null, 'EVOLVES WITH'), evos.length ? evos.map((ev) => {
        const partner = ev.parents.find((x) => x !== e.id), known = B.rank(ev.id) >= 2;
        return h('div', { class: 'recipe', style: { marginBottom: '6px' } }, faceOrQ(e.id, true), h('span', { class: 'g' }, '+'), faceOrQ(partner, B.rank(partner) >= 1), h('span', { class: 'g' }, '='), faceOrQ(ev.id, known),
          known ? h('span', { class: 'muted' }, ev.bonus) : null);
      }) : h('div', { class: 'muted' }, 'No recipe known. It may have none yet.')));
      const syn = B.synergiesOf(e.id);
      p.append(h('div', { class: 'sec' }, h('h3', null, 'COMBOS'), syn.length ? syn.map((s) => {
        const partner = s.a === e.id ? s.b : s.a;
        return h('div', { class: 'recipe', style: { marginBottom: '6px' } }, faceOrQ(partner, B.rank(partner) >= 1),
          r >= 3 ? h('span', null, h('b', { class: 'gold', style: { fontWeight: 400 } }, s.name), h('br'), h('span', { class: 'muted' }, s.detail)) : redact('▒▒▒▒▒▒ ▒▒▒▒▒', 'STUDIED'));
      }) : h('div', { class: 'muted' }, 'No combo known.')));
    } else {
      p.append(h('div', { class: 'sec' }, h('h3', null, 'RECIPE'), h('div', { class: 'recipe' }, faceOrQ(e.parents[0], B.rank(e.parents[0]) >= 1), h('span', { class: 'g' }, '+'), faceOrQ(e.parents[1], B.rank(e.parents[1]) >= 1), h('span', { class: 'g' }, '='), faceOrQ(e.id, r >= 2))));
      p.append(h('div', { class: 'sec' }, h('h3', null, 'PARTY BONUS'), r >= 2 ? h('div', null, '+' + e.hp + ' party HP. ' + e.bonus + '.') : redact('▒▒▒ ▒▒▒▒▒▒▒', 'DISCOVERED')));
    }
    return p;
  }
  function paneLog(e, r) {
    const p = h('div', { class: 'pane' }), tasks = B.TASKS[e.kind], names = B.KINDS[e.kind].ranks, nt = B.nextTask(e.id);
    p.append(h('div', { class: 'sec' }, h('h3', null, 'RESEARCH'), h('div', { class: 'steps' }, tasks.map((t, i) => {
      const done = r >= i + 1, cur = r === i;
      return h('div', { class: 'step' + (done ? ' done' : '') + (cur ? ' cur' : '') }, h('div', { class: 'ck' }, done ? '✓' : ''),
        h('div', null, h('div', { class: done ? '' : cur ? 'gold' : 'muted' }, names[i + 1].toUpperCase()), h('small', null, t),
          cur && nt && nt.total > 1 ? h('div', { class: 'prog' }, h('i', { style: { width: Math.min(100, nt.done / nt.total * 100) + '%' } })) : null,
          cur && nt && nt.total > 1 ? h('small', null, nt.done.toLocaleString('en-US') + ' / ' + nt.total.toLocaleString('en-US')) : null));
    }))));
    if (r >= 2) p.append(h('div', { class: 'sec' }, h('h3', null, 'YOUR HISTORY'), h('div', { class: 'hist' }, B.history(e.id).map(([a, b]) => h('div', null, h('b', null, b), h('span', { class: 'muted' }, a))))));
    return p;
  }

  const TABS = { creature: [['about', 'ABOUT'], ['moves', 'MOVES'], ['family', 'FAMILY'], ['log', 'LOG']], evolution: [['about', 'ABOUT'], ['moves', 'MOVES'], ['family', 'FAMILY'], ['log', 'LOG']], foe: [['about', 'ABOUT'], ['moves', 'TACTICS'], ['family', 'VARIANTS'], ['log', 'LOG']] };
  function renderDetail(animate) {
    const e = B.BY_ID[sel], r = B.rank(sel), d = $('detail'); d.replaceChildren();
    const list = visible(), i = list.findIndex((x) => x.id === sel);
    const go = (n) => { if (list.length) select(list[(i + n + list.length) % list.length].id, true); };
    d.append(h('div', { class: 'backbar' }, h('button', { onclick: () => app.classList.remove('open') }, '< LIST'), h('span', null, h('button', { onclick: () => go(-1), 'aria-label': 'Previous' }, '<'), ' ', h('button', { onclick: () => go(1), 'aria-label': 'Next' }, '>'))));
    d.append(h('div', { class: 'top' }, stage(e, r, animate), identity(e, r)));
    d.append(h('div', { class: 'tabbar', role: 'tablist' }, TABS[e.kind].map(([k, l]) => h('button', { class: 'dt' + (k === tab ? ' on' : ''), role: 'tab', onclick: () => { tab = k; renderDetail(false); } }, l))));
    const pane = { about: paneAbout, moves: paneMoves, family: paneFamily, log: paneLog }[tab](e, r);
    d.append(pane);
    d.style.setProperty('--tc', r >= 2 ? T[e.type].color : '#6b5a8f');
  }

  function select(id, animate) {
    sel = id; B.markViewed(id);
    renderHead(); renderList(); renderDetail(animate);
    if (animate) app.classList.add('open');
  }
  function render() { if (!visible().some((e) => e.id === sel) && visible()[0]) sel = visible()[0].id; renderHead(); renderList(); renderDetail(false); }

  document.addEventListener('keydown', (ev) => {
    if (ev.target.closest && ev.target.closest('button') && (ev.key === 'Enter' || ev.key === ' ')) return;
    const list = visible(), i = list.findIndex((x) => x.id === sel);
    if (ev.key === 'ArrowDown' || ev.key === 'j') { ev.preventDefault(); select(list[Math.min(list.length - 1, i + 1)].id, true); }
    if (ev.key === 'ArrowUp' || ev.key === 'k') { ev.preventDefault(); select(list[Math.max(0, i - 1)].id, true); }
  });

  B.onChange(render);
  B.demoBar();
  render();
})();
</script>
</body>
</html>
